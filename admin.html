<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieMatch Admin</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      padding: 48px 32px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 40px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }

    header h1 span {
      color: #555;
      font-weight: 400;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header a {
      color: #fff;
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    /* Quiet header links — "Sign out" and the mock toggle. Both wear this one
       class so their hover states cannot drift apart; Sign out previously carried
       an inline style, which kept it out of every header link rule. */
    .header-link {
      font-size: 0.82rem;
      color: #555;
      text-decoration: none;
    }

    .header-link:hover {
      color: #9a9a92;
      text-decoration: underline;
    }

    #last-updated {
      font-size: 0.8rem;
      color: #555;
    }

    button.refresh-btn {
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #e8e8e8;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    button.refresh-btn:hover {
      background: #242424;
      border-color: #444;
    }

    button.refresh-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* ── Stats cards ── */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 24px;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .card-value.muted {
      color: #888;
    }

    .card-sub {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #555;
    }

    /* ── Latency section ── */

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      margin-bottom: 14px;
    }

    .latency-section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
    }

    .latency-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    .latency-table th {
      text-align: right;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      padding: 0 16px 10px;
      border-bottom: 1px solid #222;
    }

    .latency-table th:first-child {
      text-align: left;
      padding-left: 0;
    }

    .latency-table td {
      text-align: right;
      padding: 10px 16px;
      font-variant-numeric: tabular-nums;
      color: #aaa;
      border-bottom: 1px solid #1f1f1f;
    }

    .latency-table tr:last-child td {
      border-bottom: none;
    }

    .latency-table td:first-child {
      text-align: left;
      padding-left: 0;
      color: #666;
      font-size: 0.8rem;
    }

    .latency-table td.p50,
    .latency-table td.p90,
    .latency-table td.p99 {
      color: #e8e8e8;
    }

    .no-data {
      font-size: 0.9rem;
      color: #555;
      padding: 8px 0;
    }

    /* ── Queries table ── */

    .table-section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
    }

    .table-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #2a2a2a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead th {
      padding: 10px 16px;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      border-bottom: 1px solid #222;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #1f1f1f;
      transition: background 0.15s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #202020;
    }

    td {
      padding: 11px 16px;
      vertical-align: top;
      color: #aaa;
    }

    td.time {
      white-space: nowrap;
      color: #555;
      font-size: 0.8rem;
    }

    td.query-cell {
      max-width: 300px;
      color: #e8e8e8;
      line-height: 1.4;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: #4a9eff;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0 2px;
      margin-left: 4px;
    }

    .toggle-btn:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-ok {
      background: #1a3a1a;
      color: #4adf86;
    }

    .badge-error {
      background: #3a1a1a;
      color: #e05c5c;
    }

    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    td.location-cell {
      font-size: 0.8rem;
      color: #aaa;
      white-space: nowrap;
    }

    td.tools {
      font-size: 0.78rem;
      color: #ff9f4a;
    }

    .empty-row td {
      text-align: center;
      color: #555;
      padding: 32px;
    }

    .table-footer {
      padding: 12px 16px;
      border-top: 1px solid #222;
      text-align: center;
    }

    .table-footer button {
      background: none;
      border: none;
      color: #4a9eff;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .table-footer button:hover {
      text-decoration: underline;
    }

    /* ── Cost projector ── */

    .projector-section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
    }

    .projector-row {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .projector-baseline,
    .projector-result {
      flex: 1;
    }

    .projector-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      margin-bottom: 8px;
    }

    .projector-value {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .projector-value.highlight {
      color: #ff9f4a;
    }

    .projector-sub {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #555;
    }

    .projector-arrow {
      font-size: 1.5rem;
      color: #333;
      flex-shrink: 0;
    }

    /* ── Watchmode API section ── */

    .watchmode-section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
    }

    .watchmode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    /* Cards nested inside a section need a lighter background to stand out. */
    .watchmode-grid .card {
      background: #222;
      border-color: #333;
    }

    /* ── Monthly usage history ──
       A table + chart: one row per month, every bar sharing a fixed 0 → limit
       domain, so bar length reads directly as "share of the monthly budget"
       rather than as a relative-to-peak length that changes meaning each month.
       Color is an emphasis pair, not a status ramp: the accent marks the current
       (still incomplete) month, past months recede to a neutral. Both were
       validated against this panel's #1a1a1a surface rather than picked by eye —
       accent 4.78:1, neutral 3.25:1, and 19.3 apart in OKLab ΔE under normal
       vision / 19.0 under deuteranopia. Don't re-tint these without re-checking. */
    .usage-history {
      /* Severity ramp for the current month, deliberately blue/yellow/red rather
         than green/yellow/red: green->yellow measured only 6.6 OKLab ΔE under
         deuteranopia, i.e. the "safe" and "getting close" states were effectively
         the same colour for a red-green colourblind reader. Blue/yellow/red puts
         the worst pair at 24.4. The red is #f4695f, not a deeper one: every
         darker red tested collapsed toward the neutral history bar under
         protanopia (#e05c5c measured 5.0), which would have hidden the current
         month exactly when it matters most. Whole set on this #1a1a1a surface:
         all >= 3:1 contrast, worst all-pairs 9.4 CVD / 19.0 normal.
         Re-run tools/validate_palette.py before touching any of these. */
      --usage-past: #6b6b66;
      --usage-safe: #3987e5;
      --usage-warning: #fab219;
      --usage-critical: #f4695f;
    }

    .usage-history-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .usage-history-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
    }

    /* Names the domain every bar is drawn against. Load-bearing: with the meter
       gone this is the only thing on screen that says what a full track means. */
    .usage-history-scale {
      font-size: 0.72rem;
      color: #444;
    }

    .usage-row {
      display: grid;
      /* Each row is its own grid, so the value column must be a FIXED width, not
         `auto`: the current month's cell is wider ("143 so far"), and auto-sizing
         would shrink that row's track alone — making its bar no longer comparable
         to the others against the shared 0 → limit domain. Sized for the widest
         possible cell, "1,000 so far". */
      grid-template-columns: 4.5rem 1fr 6.75rem 3.25rem;
      align-items: center;
      gap: 10px;
      /* Comfortably above the 2px surface gap that keeps adjacent bars reading
         as separate marks instead of one block. */
      margin-bottom: 6px;
    }

    .usage-month {
      font-size: 0.75rem;
      color: #666;
    }

    .usage-track {
      display: block;
      height: 8px;
      background: #2a2a2a;
      border-radius: 3px;
      /* Clips the fill's square left corner to the track's rounded one. The meter
         this replaced had it; without it the fill paints over the corner. */
      overflow: hidden;
    }

    .usage-fill {
      display: block;
      height: 100%;
      background: var(--usage-past);
      /* Square at the baseline it grows from, 4px rounded at the data end. */
      border-radius: 0 4px 4px 0;
      /* A single call against a 1,000 ceiling is 0.1% — without a floor the bar
         renders as nothing at all. The exact count sits in the value column, so
         this affects visibility only, never the number being read. */
      min-width: 3px;
    }

    /* Only the current month is ever coloured, so exactly one of these applies at
       a time. "Current" is carried by not-grey PLUS the "so far" label — never by
       colour alone, since critical-red sits in the CVD warn band against the neutral. */
    .usage-row.current.safe .usage-fill {
      background: var(--usage-safe);
    }

    .usage-row.current.warning .usage-fill {
      background: var(--usage-warning);
    }

    .usage-row.current.critical .usage-fill {
      background: var(--usage-critical);
    }

    /* A column of numbers, so tabular figures to keep the digits aligned. Text
       never wears the series color — the bar beside it carries identity. */
    .usage-value {
      font-size: 0.75rem;
      color: #888;
      text-align: right;
      font-variant-numeric: tabular-nums;
      /* Never clip the value — if it ever outgrew the column the number itself
         would be cropped, which is worse than no label at all. */
      overflow: visible;
      white-space: nowrap;
    }

    .usage-partial {
      color: #555;
      font-size: 0.7rem;
    }

    /* The bar already encodes share-of-limit; this states it, and replaces the
       per-bar scale caption that used to sit under the chart. Recessive so the
       call count stays the primary number. */
    .usage-percent {
      font-size: 0.72rem;
      color: #555;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }


    /* ── Mock admin styles (dev only) ──────────────────────────────────────
       Paired with the "Mock admin (dev only)" script block near the bottom of
       this file; removing the mock means cutting both fences. Kept here rather
       than injected from JS so the rules sit where a person looks for styles and
       their order against the rest of the sheet is explicit — see the .leaving
       note below for why that order matters. */

    .mock-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: -48px -32px 32px;
      padding: 10px 32px;
      background: #241c07;
      border-bottom: 1px solid #3d2f0b;
      font-size: 0.78rem;
    }

    .mock-bar strong {
      color: #fab219;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.7rem;
      margin-right: 4px;
    }

    .mock-bar a {
      color: #9a9a92;
      text-decoration: none;
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid transparent;
    }

    .mock-bar a:hover {
      color: #e8e8e8;
      border-color: #3d2f0b;
    }

    .mock-bar a.active {
      color: #0f0f0f;
      background: #fab219;
      font-weight: 600;
    }

    /* The toggle's base look comes from .header-link, which it also wears — that
       is what keeps it identical to "Sign out". Only the amber exit state lives
       here. It must stay *below* .header-link:hover: both selectors are two
       classes, so equal specificity means the later one wins, and .leaving has to
       win to stay amber while hovered. That in turn is why it needs its own
       :hover — otherwise the amber would be the one header link that never
       reacts to the cursor. */
    .mock-toggle.leaving {
      color: #fab219;
    }

    .mock-toggle.leaving:hover {
      color: #ffc94a;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1><a href="/">MovieMatch</a> <span>/ Admin</span></h1>
    <div class="header-right">
      <button class="refresh-btn" id="refreshBtn" onclick="load()">Refresh</button>
      <span id="last-updated"></span>
      <!-- The mock toggle is injected here at runtime, between the status text and
           Sign out — see _renderMockToggle() in the mock block. -->
      <a href="/admin/logout" class="header-link">Sign out</a>
    </div>
  </header>

  <div class="main">

    <div class="stats-grid" id="statsGrid">
      <!-- populated by JS -->
    </div>

    <div class="latency-section">
      <div class="section-title">Latency (ms)</div>
      <div id="latencyContent">
        <div class="no-data">No data yet.</div>
      </div>
    </div>

    <div class="table-section">
      <div class="table-header">
        <div class="section-title">Recent queries</div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Query</th>
            <th>Status</th>
            <th>Location</th>
            <th style="text-align:right">Results</th>
            <th style="text-align:right">Total ms</th>
            <th style="text-align:right">Tokens in / out</th>
            <th style="text-align:right">Est. cost</th>
            <th>Tools</th>
          </tr>
        </thead>
        <tbody id="queryTableBody">
          <tr class="empty-row">
            <td colspan="9">Loading…</td>
          </tr>
        </tbody>
      </table>
      <div class="table-footer" id="tableFooter"></div>
    </div>

    <div class="watchmode-section">
      <div class="section-title">Watchmode API</div>
      <div id="watchmodeContent">
        <div class="no-data">Loading…</div>
      </div>
    </div>

    <div class="projector-section">
      <div class="section-title">Cost projector</div>
      <div id="projectorContent">
        <div class="no-data">No data yet.</div>
      </div>
    </div>

  </div>

  <script>
    const API_LOGS = "/admin/logs";
    const API_WATCHMODE = "/admin/watchmode";
    const API_STATUS = "/admin/status";
    const QUERY_TRUNCATE = 60;

    async function load() {
      // Mock mode renders the whole page from fixtures. This must stay the first
      // statement in load(): the point of ?mock is that it works with no server
      // and no auth, so it has to return before any fetch() is issued.
      //
      // Deferred to DOMContentLoaded rather than called inline, because
      // _renderTableRows() reads US_STATE_ABBREV, which is declared in a later
      // <script> block. The live path only reaches it after awaiting a fetch, by
      // which time every block has parsed; rendering synchronously here would hit
      // that const's temporal dead zone and throw.
      if (MOCK_ACTIVE) { document.addEventListener("DOMContentLoaded", runMockAdmin); return; }

      const btn = document.getElementById("refreshBtn");
      btn.disabled = true;

      // Kick off all three requests up front so they run in parallel — the
      // status/watchmode calls must not delay the main logs panel.
      const wmFetch = fetch(API_WATCHMODE);
      const statusFetch = fetch(API_STATUS);
      const logsFetch = fetch(API_LOGS);

      // Resolve the ingested-movie count from /admin/status. A failure here
      // leaves the count as null so its card renders muted ("—") rather than
      // blocking the rest of the panel.
      let movieCount = null;
      try {
        const statusRes = await statusFetch;
        if (statusRes.ok) movieCount = (await statusRes.json()).chroma_count ?? null;
      } catch {
        // Silently fall through — the card shows "—".
      }

      try {
        const res = await logsFetch;
        if (res.status === 401) { window.location.href = "/admin/login"; return; }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderStats(data.stats, movieCount);
        renderLatencyBar(data.stats);
        renderProjector(data.stats);
        renderTable(data.entries);
        document.getElementById("last-updated").textContent =
          "Updated " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("last-updated").textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }

      // Render the watchmode section independently — a failure here
      // never affects the main panel.
      try {
        const wmRes = await wmFetch;
        if (wmRes.ok) renderWatchmode(await wmRes.json());
      } catch {
        // Silently fail — watchmode content stays as "Loading…"
      }
    }

    function renderWatchmode(wm) {
      const container = document.getElementById("watchmodeContent");
      const callsMonth = wm.api_calls_month ?? 0;
      const callsSession = wm.api_calls_session ?? 0;
      const hits = wm.cache_hits_session ?? 0;
      const cacheSize = wm.cache_size ?? 0;
      const limit = wm.monthly_limit ?? 1000;
      const total = callsMonth + hits;
      const hitRate = total > 0 ? Math.round(hits / total * 100) : null;

      container.innerHTML = `
        <div class="watchmode-grid">
          <div class="card">
            <div class="card-label">API calls (this month)</div>
            <div class="card-value ${callsMonth === 0 ? "muted" : ""}">${callsMonth.toLocaleString()}</div>
            <div class="card-sub">${callsSession.toLocaleString()} this session · ${limit.toLocaleString()} / month free tier</div>
          </div>
          <div class="card">
            <div class="card-label">Cache hits (session)</div>
            <div class="card-value ${hits === 0 ? "muted" : ""}">${hits.toLocaleString()}</div>
            <div class="card-sub">${hitRate !== null ? hitRate + "% hit rate" : "no lookups yet"}</div>
          </div>
          <div class="card">
            <div class="card-label">Cache entries</div>
            <div class="card-value ${cacheSize === 0 ? "muted" : ""}">${cacheSize.toLocaleString()}</div>
            <div class="card-sub">24 h TTL</div>
          </div>
        </div>
        ${usageHistoryMarkup(Array.isArray(wm.history) ? wm.history : [], limit)}
      `;
    }

    // "2026-08" -> "Aug 2026". Built in UTC to match the backend's month key:
    // parsing "2026-08-01" as a local date would render the previous month for
    // anyone west of UTC, so the chart would silently disagree with the counter
    // above it. The year is carried because 12 retained months span two calendar
    // years — without it the oldest and newest bars can share a month name.
    function monthLabel(key) {
      const [y, m] = String(key).split("-").map(Number);
      if (!y || !m) return key;
      return new Date(Date.UTC(y, m - 1, 1))
        .toLocaleDateString(undefined, { month: "short", year: "numeric", timeZone: "UTC" });
    }

    // Budget severity for the *current* month only. Thresholds match the meter this
    // replaced (50% / 80%). Past months stay neutral on purpose: severity is only
    // actionable for the month you can still influence, and colouring all twelve
    // would make every row shout a status and bury the one you can act on.
    function severityClass(pct) {
      return pct >= 80 ? "critical" : pct >= 50 ? "warning" : "safe";
    }

    // Percent of the monthly limit. Rounds to whole numbers, but never rounds a
    // real value down to a bare "0%" — a month with calls in it never reads as unused.
    function percentLabel(n, limit) {
      const pct = n / limit * 100;
      if (n > 0 && pct < 1) return "<1%";
      return `${Math.round(pct)}%`;
    }

    // Month-over-month usage. The backend sends history oldest-first and always
    // includes the current month (at 0 if it has had no calls yet), so the last
    // entry is "now": it carries the severity colour plus a "so far" marker, since
    // a partial month would otherwise read as a real drop against full ones.
    function usageHistoryMarkup(history, limit) {
      // One guard owns the whole block, heading included. The head used to be emitted
      // by renderWatchmode() instead, so an empty history left the "Monthly history"
      // title and the scale label stranded over blank space — visible at ?mock=empty,
      // and reachable from any payload with no `history` array.
      if (!history.length) return "";

      // Read from the *chronological* array, before the display reversal below:
      // taking the last entry after reversing would mark the oldest month as current.
      const currentMonth = history[history.length - 1].month;

      // Rendered newest-first so the month you're actively spending sits at the top,
      // against the heading, rather than below eleven months of history. The backend
      // contract stays oldest-first; this is display order only. Reverse a copy —
      // reverse() mutates, and the caller's array is reused (the mock hands the same
      // fixture object back on every state switch, which would flip order each time).
      const rows = [...history].reverse().map(({ month, calls }) => {
        const n = calls ?? 0;
        const pct = Math.min(n / limit * 100, 100);
        const isCurrent = month === currentMonth;
        const rowClass = isCurrent ? ` current ${severityClass(pct)}` : "";
        // escapeHtml because monthLabel() returns the key verbatim when it can't parse
        // it, and the key originates in a JSON file on disk. watchmode.py validates
        // those keys on load; this is the second layer, and matches how every other
        // untrusted value in this file is interpolated.
        const label = escapeHtml(monthLabel(month));
        return `
          <div class="usage-row${rowClass}"
               title="${label} · ${n.toLocaleString()} calls · ${percentLabel(n, limit)} of the ${limit.toLocaleString()} limit">
            <span class="usage-month">${label}</span>
            <span class="usage-track">${n > 0 ? `<span class="usage-fill" style="width: ${pct.toFixed(1)}%"></span>` : ""}</span>
            <span class="usage-value">${n.toLocaleString()}${isCurrent ? ` <span class="usage-partial">so far</span>` : ""}</span>
            <span class="usage-percent">${percentLabel(n, limit)}</span>
          </div>`;
      }).join("");

      return `
        <div class="usage-history-head">
          <span class="usage-history-title">Monthly history</span>
          <span class="usage-history-scale">${limit.toLocaleString()} / month limit</span>
        </div>
        <div class="usage-history">
          ${rows}
        </div>`;
    }

    function fmt(val, suffix = "") {
      if (val === null || val === undefined) return "—";
      return val.toLocaleString() + suffix;
    }

    function renderStats(s, movieCount = null) {
      const errorRate = s.total_requests > 0
        ? Math.round(s.error_count / s.total_requests * 100) + "%"
        : "—";

      const cards = [
        { label: "Movies indexed", value: movieCount != null ? fmt(movieCount) : "—", sub: "in the vector DB" },
        { label: "Total requests", value: fmt(s.total_requests), sub: `${fmt(s.error_count)} errors (${errorRate})` },
        { label: "Avg total (ms)", value: fmt(s.avg_total_ms), sub: `p50: ${fmt(s.p50_total_ms)} ms` },
        { label: "Avg embedding (ms)", value: fmt(s.avg_embedding_ms), sub: `Chroma: ${fmt(s.avg_chroma_ms)} ms` },
        {
          label: "Avg tokens", value: s.avg_input_tokens != null ? fmt(s.avg_input_tokens) : "—",
          sub: `out: ${fmt(s.avg_output_tokens)}`
        },
        {
          label: "Tool use rate", value: s.tool_use_rate != null ? s.tool_use_rate + "%" : "—",
          sub: "queries with tool calls"
        },
        { label: "Avg cost / query", value: fmtCost(s.avg_cost_usd), sub: "est. based on token split" },
        { label: "Total est. cost", value: fmtCostTotal(s.total_cost_usd), sub: "across all logged requests" },
      ];

      const grid = document.getElementById("statsGrid");
      grid.innerHTML = cards.map(c => `
        <div class="card">
          <div class="card-label">${c.label}</div>
          <div class="card-value ${c.value === "—" ? "muted" : ""}">${c.value}</div>
          <div class="card-sub">${c.sub}</div>
        </div>
      `).join("");
    }

    function renderLatencyBar(s) {
      const container = document.getElementById("latencyContent");
      if (s.p50_total_ms == null) {
        container.innerHTML = '<div class="no-data">No data yet.</div>';
        return;
      }

      const rows = [
        { label: "Total", avg: s.avg_total_ms, p50: s.p50_total_ms, p90: s.p90_total_ms, p99: s.p99_total_ms },
        { label: "Claude", avg: s.avg_claude_ms, p50: s.p50_claude_ms, p90: s.p90_claude_ms, p99: s.p99_claude_ms },
        { label: "Embedding", avg: s.avg_embedding_ms, p50: s.p50_embedding_ms, p90: s.p90_embedding_ms, p99: s.p99_embedding_ms },
        { label: "Chroma", avg: s.avg_chroma_ms, p50: s.p50_chroma_ms, p90: s.p90_chroma_ms, p99: s.p99_chroma_ms },
      ];

      container.innerHTML = `
        <table class="latency-table">
          <thead>
            <tr>
              <th></th>
              <th>avg</th>
              <th>p50</th>
              <th>p90</th>
              <th>p99</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${r.label}</td>
                <td class="p50">${fmt(r.avg)}</td>
                <td class="p50">${fmt(r.p50)}</td>
                <td class="p90">${fmt(r.p90)}</td>
                <td class="p99">${fmt(r.p99)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderProjector(s) {
      const container = document.getElementById("projectorContent");
      const avg = s.recent_avg_cost_usd;
      const count = s.recent_query_count || 0;

      if (avg === null || avg === undefined) {
        container.innerHTML = '<div class="no-data">No cost data yet.</div>';
        return;
      }

      const proj1k = avg * 1000;
      const countLabel = count === 1 ? "last 1 query" : `last ${count.toLocaleString()} queries`;

      container.innerHTML = `
        <div class="projector-row">
          <div class="projector-baseline">
            <div class="projector-label">Avg cost / query</div>
            <div class="projector-value">${fmtCost(avg)}</div>
            <div class="projector-sub">${countLabel}</div>
          </div>
          <div class="projector-arrow">→</div>
          <div class="projector-result">
            <div class="projector-label">Projected cost at 1,000 queries</div>
            <div class="projector-value highlight">${fmtCostTotal(proj1k)}</div>
          </div>
        </div>
      `;
    }

    const TABLE_PREVIEW = 5;
    let _tableEntries = [];
    let _tableExpanded = false;

    function renderTable(entries) {
      _tableEntries = entries || [];
      _tableExpanded = false;
      _renderTableRows();
      _renderTableFooter();
    }

    function toggleTable() {
      _tableExpanded = !_tableExpanded;
      _renderTableRows();
      _renderTableFooter();
    }

    function _renderTableRows() {
      const tbody = document.getElementById("queryTableBody");
      if (_tableEntries.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="9">No requests logged yet.</td></tr>';
        return;
      }
      const visible = _tableExpanded ? _tableEntries : _tableEntries.slice(0, TABLE_PREVIEW);
      tbody.innerHTML = visible.map(e => {
        const time = formatTime(e.timestamp);
        const query = renderQuery(e.query || "");
        const badge = e.status === "ok"
          ? '<span class="badge badge-ok">ok</span>'
          : '<span class="badge badge-error">error</span>';
        let location;
        if (e.location) {
          location = escapeHtml(e.location);
          if (e.location_detail) {
            // Abbreviate the region segment (last element after ", ") using the
            // US state map when available; non-US regions fall back to full name.
            const parts = e.location_detail.split(", ");
            const last = parts[parts.length - 1];
            parts[parts.length - 1] = US_STATE_ABBREV[last] || last;
            location += `<br><span style="color:#555;font-size:0.72rem">(${escapeHtml(parts.join(", "))})</span>`;
          }
        } else {
          location = '<span style="color:#444">N/A</span>';
        }
        const results = e.status === "ok" ? fmt(e.result_count) : "—";
        const totalMs = fmt(e.total_ms);
        const tokens = (e.input_tokens != null && e.output_tokens != null)
          ? `${fmtTokens(e.input_tokens)} / ${fmtTokens(e.output_tokens)}`
          : "—";
        const cost = fmtCost(e.estimated_cost_usd);
        const tools = (e.tools_called && e.tools_called.length > 0)
          ? e.tools_called.map(abbreviateTool).join(", ")
          : "—";
        return `
          <tr>
            <td class="time">${time}</td>
            <td class="query-cell">${query}</td>
            <td>${badge}</td>
            <td class="location-cell">${location}</td>
            <td class="num">${results}</td>
            <td class="num">${totalMs}</td>
            <td class="num">${tokens}</td>
            <td class="num">${cost}</td>
            <td class="tools">${escapeHtml(tools)}</td>
          </tr>
        `;
      }).join("");
    }

    function _renderTableFooter() {
      const footer = document.getElementById("tableFooter");
      if (_tableEntries.length <= TABLE_PREVIEW) {
        footer.innerHTML = "";
        return;
      }
      if (_tableExpanded) {
        footer.innerHTML = `<button onclick="toggleTable()">Show less</button>`;
      } else {
        footer.innerHTML = `<button onclick="toggleTable()">Show all (${_tableEntries.length.toLocaleString()})</button>`;
      }
    }

    let _queryId = 0;

    function renderQuery(query) {
      if (query.length <= QUERY_TRUNCATE) return escapeHtml(query);
      const id = ++_queryId;
      return `<span id="qs-${id}">${escapeHtml(query.slice(0, QUERY_TRUNCATE))}&hellip;<button class="toggle-btn" onclick="toggleQuery(${id})">more</button></span>`
        + `<span id="qf-${id}" hidden>${escapeHtml(query)}<button class="toggle-btn" onclick="toggleQuery(${id})">less</button></span>`;
    }

    function toggleQuery(id) {
      document.getElementById("qs-" + id).hidden = !document.getElementById("qs-" + id).hidden;
      document.getElementById("qf-" + id).hidden = !document.getElementById("qf-" + id).hidden;
    }

    function abbreviateTool(name) {
      return name === "search_person" ? "person" : name === "get_filmography" ? "filmography" : name;
    }

    function fmtTokens(n) {
      return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
    }

    function fmtCost(usd) {
      if (usd === null || usd === undefined) return "—";
      if (usd === 0) return "$0.00";
      if (usd < 0.0001) return "<$0.0001";
      return "$" + usd.toFixed(4);
    }

    function fmtCostTotal(usd) {
      if (usd === null || usd === undefined) return "—";
      if (usd === 0) return "$0.00";
      if (usd >= 1) return "$" + usd.toFixed(2);
      if (usd < 0.0001) return "<$0.0001";
      return "$" + usd.toFixed(4);
    }

    function formatTime(ts) {
      if (!ts) return "—";
      const d = new Date(ts);
      const diffMs = Date.now() - d.getTime();
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return "just now";
      if (diffMin < 60) return diffMin + "m ago";
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + "h ago";
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
        + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ── Mock admin (dev only) ─────────────────────────────────────────────
    // `?mock` (or `?mock=<state>`) renders the whole page from fixtures: no
    // server, no auth, no network. The panel sits behind HMAC auth, so without
    // this there is no way to review these states without a running, logged-in
    // instance — and the sparse ones (fresh deploy, a single month of history)
    // are precisely the ones you cannot conjure on demand against real data.
    //
    // All mock *behaviour* lives between here and "End mock" below; its styles
    // live in the "Mock admin styles (dev only)" fence in the <style> block
    // above. Removing the mock means cutting both. It is inert unless the ?mock
    // param is present.

    const MOCK_PARAM = new URLSearchParams(location.search).get("mock");
    const MOCK_ACTIVE = MOCK_PARAM !== null;

    // Relative so the queries table renders "5m ago" rather than a stale date.
    const _mockAgo = (min) => new Date(Date.now() - min * 60000).toISOString();

    // Month keys ending at the *current* month, so the fixtures stay correct as
    // time passes and the last row really is "now" — the rule the chart's
    // current-month styling depends on.
    function _mockMonths(n) {
      const now = new Date();
      return Array.from({ length: n }, (_, i) => {
        const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - (n - 1 - i), 1));
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
      });
    }

    // Deliberately includes a maxed month (1,000), a zero month, and two
    // sub-1% months, so the clamp, the empty track and the "<1%" label all
    // appear inside the dense fixtures rather than needing their own states.
    const _MOCK_PAST = [612, 874, 1000, 233, 4, 481, 725, 0, 96, 1, 847];

    function _mockHistory(currentCalls) {
      const months = _mockMonths(_MOCK_PAST.length + 1);
      return months.map((month, i) => ({
        month,
        calls: i < _MOCK_PAST.length ? _MOCK_PAST[i] : currentCalls,
      }));
    }

    // `session` defaults to a warm process; the empty state passes zeros so the
    // cache cards agree with "nothing has happened yet" rather than showing a
    // 100% hit rate on a fresh deploy.
    function _mockWatchmode(currentCalls, history, session) {
      const { calls = 12, hits = 388, size = 96 } = session ?? {};
      return {
        api_calls_month: currentCalls, api_calls_session: calls,
        cache_hits_session: hits, cache_size: size, monthly_limit: 1000,
        history: history ?? _mockHistory(currentCalls),
      };
    }

    const MOCK_STATS_DENSE = {
      total_requests: 1284, error_count: 17,
      avg_total_ms: 2140, p50_total_ms: 1980, p90_total_ms: 3120, p99_total_ms: 5400,
      avg_claude_ms: 1520, p50_claude_ms: 1400, p90_claude_ms: 2350, p99_claude_ms: 4100,
      avg_embedding_ms: 180, p50_embedding_ms: 172, p90_embedding_ms: 240, p99_embedding_ms: 390,
      avg_chroma_ms: 44, p50_chroma_ms: 38, p90_chroma_ms: 71, p99_chroma_ms: 130,
      avg_input_tokens: 3820, avg_output_tokens: 410, tool_use_rate: 23,
      avg_cost_usd: 0.0041, total_cost_usd: 5.27,
      recent_avg_cost_usd: 0.0038, recent_query_count: 50,
    };

    // Fresh deploy: exercises every "no data" branch at once — muted stat cards,
    // the latency and projector empty states, and the table's empty row.
    const MOCK_STATS_EMPTY = {
      total_requests: 0, error_count: 0,
      avg_total_ms: null, p50_total_ms: null, p90_total_ms: null, p99_total_ms: null,
      avg_claude_ms: null, p50_claude_ms: null, p90_claude_ms: null, p99_claude_ms: null,
      avg_embedding_ms: null, p50_embedding_ms: null, p90_embedding_ms: null, p99_embedding_ms: null,
      avg_chroma_ms: null, p50_chroma_ms: null, p90_chroma_ms: null, p99_chroma_ms: null,
      avg_input_tokens: null, avg_output_tokens: null, tool_use_rate: null,
      avg_cost_usd: null, total_cost_usd: null,
      recent_avg_cost_usd: null, recent_query_count: 0,
    };

    // A single logged request — every figure consistent with the one table row the
    // sparse state renders, so the numbers on screen agree with each other.
    const MOCK_STATS_SPARSE = {
      ...MOCK_STATS_DENSE,
      total_requests: 1, error_count: 0,
      avg_total_ms: 1980, p50_total_ms: 1980, p90_total_ms: 1980, p99_total_ms: 1980,
      avg_claude_ms: 1400, p50_claude_ms: 1400, p90_claude_ms: 1400, p99_claude_ms: 1400,
      avg_embedding_ms: 172, p50_embedding_ms: 172, p90_embedding_ms: 172, p99_embedding_ms: 172,
      avg_chroma_ms: 38, p50_chroma_ms: 38, p90_chroma_ms: 38, p99_chroma_ms: 38,
      avg_input_tokens: 3610, avg_output_tokens: 388, tool_use_rate: 0,
      avg_cost_usd: 0.0037, total_cost_usd: 0.0037,
      recent_avg_cost_usd: 0.0037, recent_query_count: 1,
    };

    const MOCK_ENTRIES = [
      {
        timestamp: _mockAgo(2), query: "cozy sci-fi like Arrival but funnier", status: "ok",
        location: "US", location_detail: "Brooklyn, New York", result_count: 8,
        total_ms: 1980, input_tokens: 3610, output_tokens: 388,
        estimated_cost_usd: 0.0037, tools_called: [],
      },
      {
        timestamp: _mockAgo(9), query: "movies directed by Bong Joon-ho", status: "ok",
        location: "KR", location_detail: "Seoul", result_count: 10,
        total_ms: 3240, input_tokens: 5120, output_tokens: 602,
        estimated_cost_usd: 0.0061, tools_called: ["search_person", "get_filmography"],
      },
      {
        timestamp: _mockAgo(37), query: "family friendly animated films from the 90s",
        status: "ok", location: "GB", location_detail: "Manchester, England",
        result_count: 9, total_ms: 1740, input_tokens: 3280, output_tokens: 351,
        estimated_cost_usd: 0.0033, tools_called: [],
      },
      {
        timestamp: _mockAgo(95), query: "a very long query that should be truncated in the table "
          + "because it rambles on well past any reasonable length for a single cell",
        status: "ok", location: "US", location_detail: "Austin, Texas",
        result_count: 6, total_ms: 2610, input_tokens: 4410, output_tokens: 470,
        estimated_cost_usd: 0.0046, tools_called: ["get_filmography"],
      },
      {
        timestamp: _mockAgo(180), query: "something like Krull", status: "error",
        location: null, location_detail: null, result_count: null,
        total_ms: 5400, input_tokens: null, output_tokens: null,
        estimated_cost_usd: null, tools_called: [],
      },
    ];

    // Ordered from emptiest to densest — the switcher renders them in this order.
    const MOCK_STATES = {
      empty: {
        label: "Fresh deploy — nothing logged, no history",
        stats: MOCK_STATS_EMPTY, movieCount: null, entries: [],
        wm: _mockWatchmode(0, [], { calls: 0, hits: 0, size: 0 }),
      },
      sparse: {
        label: "First month — a single call, no comparison yet",
        // Its own stats rather than MOCK_STATS_EMPTY: pairing "total_requests: 0" with
        // a populated queries table showed contradictory numbers to whoever is
        // reviewing this state, which is the one thing a fixture must never do.
        stats: MOCK_STATS_SPARSE, movieCount: 8412, entries: MOCK_ENTRIES.slice(0, 1),
        wm: _mockWatchmode(1, [{ month: _mockMonths(1)[0], calls: 1 }], { calls: 1, hits: 4, size: 2 }),
      },
      two: {
        label: "Two months — the minimum real comparison",
        stats: MOCK_STATS_DENSE, movieCount: 8412, entries: MOCK_ENTRIES.slice(0, 2),
        wm: _mockWatchmode(143, _mockMonths(2).map((month, i) => ({ month, calls: i ? 143 : 847 }))),
      },
      safe: {
        label: "Full history — current month at 14%",
        stats: MOCK_STATS_DENSE, movieCount: 8412, entries: MOCK_ENTRIES,
        wm: _mockWatchmode(143),
      },
      warning: {
        label: "Full history — current month at 64%",
        stats: MOCK_STATS_DENSE, movieCount: 8412, entries: MOCK_ENTRIES,
        wm: _mockWatchmode(640),
      },
      critical: {
        label: "Full history — current month at 91%",
        stats: MOCK_STATS_DENSE, movieCount: 8412, entries: MOCK_ENTRIES,
        wm: _mockWatchmode(910),
      },
      capped: {
        label: "Quota spent — 100%, widest label the columns must hold",
        stats: MOCK_STATS_DENSE, movieCount: 8412, entries: MOCK_ENTRIES,
        wm: _mockWatchmode(1000),
      },
    };

    function runMockAdmin() {
      // Object.hasOwn, not a truthiness check: MOCK_STATES is an object literal, so
      // `?mock=constructor` (or toString, valueOf, hasOwnProperty) would otherwise
      // resolve an inherited function, and state.stats would be undefined.
      const name = Object.hasOwn(MOCK_STATES, MOCK_PARAM ?? "") ? MOCK_PARAM : "safe";
      const state = MOCK_STATES[name];
      renderStats(state.stats, state.movieCount);
      renderLatencyBar(state.stats);
      renderProjector(state.stats);
      renderTable(state.entries);
      renderWatchmode(state.wm);
      document.getElementById("last-updated").textContent = state.label;
      // Refresh would only re-render the same fixture; disable it so the button
      // can't imply the page is live.
      document.getElementById("refreshBtn").disabled = true;
      _renderMockSwitcher(name);
    }

    // The one link that crosses the boundary in both directions: it opens the mock
    // from the live page, and returns to the live page from the mock. Rendered
    // unconditionally (not only in mock mode) so it is reachable from a real admin
    // session — but it still lives inside this block, so deleting the block removes
    // the entrance along with everything it leads to.
    function _renderMockToggle() {
      const link = document.createElement("a");
      // header-link carries the shared quiet-link look, so the toggle and "Sign out"
      // stay visually identical; mock-toggle only adds the amber exit state.
      link.className = "header-link mock-toggle" + (MOCK_ACTIVE ? " leaving" : "");
      // Leaving drops the query string entirely rather than pointing at a hardcoded
      // path, so this works identically at /admin.html and over file://.
      link.href = MOCK_ACTIVE ? location.pathname : "?mock";
      link.textContent = MOCK_ACTIVE ? "Exit mock" : "Mock";
      link.title = MOCK_ACTIVE
        ? "Return to the live admin page"
        : "Render this page from fixtures — no server or auth required";

      // Sits between the status text and Sign out. Anchored to the logout link
      // rather than an index, so adding anything to the header can't silently
      // shuffle it; appended only if that anchor ever disappears.
      const right = document.querySelector(".header-right");
      const signOut = right.querySelector('a[href="/admin/logout"]');
      right.insertBefore(link, signOut);
    }

    function _renderMockSwitcher(active) {
      const bar = document.createElement("div");
      bar.className = "mock-bar";
      bar.innerHTML = "<strong>Mock</strong>" + Object.entries(MOCK_STATES)
        .map(([key, s]) =>
          `<a href="?mock=${key}" class="${key === active ? "active" : ""}"`
          + ` title="${escapeHtml(s.label)}">${key}</a>`)
        .join("");
      document.body.prepend(bar);
    }

    _renderMockToggle();
    // ── End mock ──────────────────────────────────────────────────────────

    load();
  </script>

  <!-- US state name → abbreviation map. Used by _renderTableRows to compact
       the location detail line. Non-US region names are passed through as-is. -->

      "Missouri": "MO", "Montana": "MT", "Nebraska": "NE", "Nevada": "NV",
      "New Hampshire": "NH", "New Jersey": "NJ", "New Mexico": "NM", "New York": "NY",
      "North Carolina": "NC", "North Dakota": "ND", "Ohio": "OH", "Oklahoma": "OK",
