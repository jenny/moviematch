<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieMatch</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 36px;
    }

    header h4 {
      margin-top: 8px;
      font-size: 1.8rem;
      color: #888;
    }

    header p {
      margin-top: 8px;
      font-size: 1rem;
      font-style: italic;
      color: #888;
    }

    .search-form {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 48px;
    }

    .search-form input {
      flex: 1;
      padding: 14px 18px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #e8e8e8;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-form input::placeholder {
      color: #555;
    }

    .search-form input:focus {
      border-color: #555;
    }

    .search-form button {
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: #e8e8e8;
      color: #0f0f0f;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    .search-form button:hover {
      background: #fff;
    }

    .search-form button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 32px;
      min-height: 1.2em;
    }

    #status.error {
      color: #e05c5c;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease both;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .card:hover {
      border-color: #444;
      background: #1f1f1f;
    }

    .card-poster {
      width: 60px;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
      background: #2a2a2a;
      aspect-ratio: 2/3;
    }

    .card-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-rank {
      font-size: 0.85rem;
      font-weight: 700;
      color: #444;
      min-width: 24px;
      padding-top: 2px;
    }

    .card-body {
      flex: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }

    .card-title-link {
      color: inherit;
      text-decoration: none;
    }

    .card-title-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .card-year {
      font-weight: 600;
      color: #fff;
      margin-left: 6px;
      font-size: 0.95rem;
    }

    .card-rating {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #888;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 7px;
      vertical-align: middle;
      letter-spacing: 0.03em;
    }

    .card-rating:empty {
      display: none;
    }

    .card-explanation {
      font-size: 0.9rem;
      color: #888;
      line-height: 1.5;
    }

    /* Clickable director / cast names inside the detail overlay */
    .more-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }

    .more-link:hover {
      color: #ddd;
    }

    /* Pivot icon shared by card button and overlay links */
    .pivot-icon {
      flex-shrink: 0;
      opacity: 0.6;
    }

    .more-link:hover .pivot-icon {
      opacity: 1;
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid #333;
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Overlay ─────────────────────────────────────────────────── */

    .overlay-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .overlay-backdrop.open {
      display: flex;
    }

    .overlay-panel {
      position: relative;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      width: min(640px, calc(100vw - 32px));
      height: min(520px, calc(100vh - 64px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: overlayIn 0.2s ease both;
    }

    .overlay-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 32px 32px 24px;
    }

    @keyframes overlayIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .overlay-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #555;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    .overlay-close:hover {
      color: #e8e8e8;
      background: #2a2a2a;
    }

    .overlay-content {
      display: flex;
      gap: 24px;
    }

    .overlay-poster {
      flex-shrink: 0;
      width: 120px;
      border-radius: 10px;
      overflow: hidden;
      background: #2a2a2a;
      aspect-ratio: 2/3;
      align-self: flex-start;
    }

    .overlay-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay-poster-placeholder {
      width: 100%;
      height: 100%;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 2rem;
    }

    .overlay-info {
      flex: 1;
      min-width: 0;
    }

    .overlay-title-pivot {
      margin-left: 6px;
      vertical-align: middle;
    }

    .overlay-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .overlay-title-year {
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
      margin-left: 8px;
    }

    .overlay-rating {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #888;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 8px;
      vertical-align: middle;
      letter-spacing: 0.03em;
    }

    .overlay-rating:empty {
      display: none;
    }

    .overlay-section {
      margin-bottom: 14px;
    }

    .overlay-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin-bottom: 4px;
    }

    .overlay-text {
      font-size: 0.9rem;
      color: #b0b0b0;
      line-height: 1.55;
    }

    .overlay-streaming {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .overlay-provider {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #242424;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.82rem;
      color: #ccc;
    }

    .overlay-provider img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
    }

    .overlay-streaming-loading {
      font-size: 0.85rem;
      color: #555;
      font-style: italic;
    }

    .overlay-streaming-none {
      font-size: 0.85rem;
      color: #b0b0b0;
    }

    .overlay-streaming-attribution {
      width: 100%;
      margin-top: 6px;
      font-size: 0.72rem;
      color: #555;
    }

    .overlay-streaming-attribution a {
      color: #555;
      text-decoration: none;
    }

    .overlay-streaming-attribution a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 48px;
      font-size: 0.85rem;
    }

    footer a {
      color: #888;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* ── Carousel nav ────────────────────────────────────────────── */

    .overlay-frame {
      position: relative;
      display: flex;
      align-items: center;
      width: min(640px, calc(100vw - 32px));
    }

    .overlay-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 14px 32px 18px;
      border-top: 1px solid #2a2a2a;
    }

    .overlay-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .overlay-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: none;
      background: #3a3a3a;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s, transform 0.15s;
    }

    .overlay-dot.active {
      background: #ccc;
      transform: scale(1.25);
    }

    .overlay-dot:hover:not(.active) {
      background: #666;
    }

    .overlay-arrow {
      display: none;
    }

    @media (min-width: 521px) {
      .overlay-arrow {
        display: flex;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 50%;
        color: #aaa;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, opacity 0.15s;
        padding: 0;
      }

      .overlay-arrow:hover {
        background: #2e2e2e;
        color: #fff;
      }

      .overlay-arrow[hidden] {
        visibility: hidden;
        pointer-events: none;
      }

      .overlay-arrow-prev {
        right: calc(100% + 12px);
      }

      .overlay-arrow-next {
        left: calc(100% + 12px);
      }
    }

    /* ── Mobile ──────────────────────────────────────────────────── */

    @keyframes overlaySlideUp {
      from {
        transform: translateY(100%);
        opacity: 1;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 32px 16px;
      }

      header h1 {
        font-size: 2rem;
        margin-bottom: 16px;
      }

      header h4 {
        font-size: 1.2rem;
      }

      .search-form {
        margin-bottom: 32px;
      }

      .card {
        padding: 14px 16px;
        gap: 12px;
      }

      .overlay-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 88vh;
        border-radius: 20px 20px 0 0;
        animation: overlaySlideUp 0.25s ease both;
      }

      .overlay-scroll {
        padding: 20px 16px 16px;
      }

      .overlay-nav {
        padding: 10px 16px 20px;
      }

      .overlay-close {
        top: 12px;
        right: 12px;
      }

      .overlay-poster {
        width: 80px;
      }

      .overlay-title {
        font-size: 1.1rem;
      }

      .overlay-nav-btn {
        padding: 8px 12px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>

<body>

  <!-- Reusable SVG symbols — hidden, referenced via <use> throughout the page -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
    <!--
      "More like this" pivot icon: a horizontal stem that forks into two
      arrowheads, suggesting "branch from here into related content."
    -->
    <symbol id="icon-pivot" viewBox="0 0 14 12" fill="none" stroke="currentColor"
            stroke-linecap="butt" stroke-linejoin="miter">
      <!-- Stem + two diverging branches (Y-fork pointing right) -->
      <path d="M 1,6 L 6,6 L 12,2 M 6,6 L 12,10" stroke-width="1.5"/>
      <!-- Arrowhead on upper branch (wings perpendicular to arm direction) -->
      <polyline points="8.4,2.0 12,2 10.6,5.3" stroke-width="2"/>
      <!-- Arrowhead on lower branch (wings perpendicular to arm direction) -->
      <polyline points="8.4,10.0 12,10 10.6,6.7" stroke-width="2"/>
    </symbol>
  </svg>

  <header>
    <h1>MovieMatch</h1>
    <h4>What would you like to watch today?</h4>
    <p>Describe what you're in the mood for and we'll find the best matches.</p>
  </header>

  <form class="search-form" id="searchForm">
    <input type="text" id="queryInput" placeholder="Describe what you're in the mood for…" autocomplete="off"
      autofocus />
    <button type="submit" id="submitBtn">Search</button>
  </form>

  <div id="status"></div>
  <div class="spinner" id="spinner"></div>
  <div class="results" id="results"></div>

  <footer>
    <a href="https://github.com/jenny/moviematch" target="_blank" rel="noopener">Built with Claude Code.</a>
  </footer>

  <!-- Detail overlay -->
  <div class="overlay-backdrop" id="overlayBackdrop" role="dialog" aria-modal="true">
    <div class="overlay-frame">
      <button class="overlay-arrow overlay-arrow-prev" id="overlayPrev" aria-label="Previous">&#8249;</button>
      <div class="overlay-panel" id="overlayPanel">
        <button class="overlay-close" id="overlayClose" aria-label="Close">&times;</button>
        <div class="overlay-scroll">
          <div class="overlay-content" id="overlayContent"></div>
        </div>
        <div class="overlay-nav">
          <div class="overlay-dots" id="overlayDots"></div>
        </div>
      </div>
      <button class="overlay-arrow overlay-arrow-next" id="overlayNext" aria-label="Next">&#8250;</button>
    </div>
  </div>

  <script>
    const API_URL = "/recommend";

    const form = document.getElementById("searchForm");
    const input = document.getElementById("queryInput");
    const btn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const spinner = document.getElementById("spinner");
    const resultsEl = document.getElementById("results");
    const backdrop = document.getElementById("overlayBackdrop");
    const overlayContent = document.getElementById("overlayContent");
    const overlayClose = document.getElementById("overlayClose");
    const overlayPrev = document.getElementById("overlayPrev");
    const overlayNext = document.getElementById("overlayNext");
    const overlayDots = document.getElementById("overlayDots");

    let allResults = [];
    let overlayIndex = 0;

    // ── Mock data ────────────────────────────────────────────────────
    // Type "__mock__" as the query to bypass the backend entirely and
    // render fake results through the same code path as real searches.
    // Useful for front-end-only changes (styling, layout, icons, etc.)
    // without needing a running server.
    const MOCK_QUERY = "__mock__";

    const MOCK_RESULTS = [
      {
        title: "Inception",
        year: "2010",
        certification: "PG-13",
        explanation: "A thief who steals corporate secrets through dream-sharing is given the inverse task of planting an idea — layered, kinetic, and endlessly rewatchable.",
        movie_poster: "/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg",
        overview: "Dom Cobb is a skilled thief, the absolute best in the dangerous art of extraction: stealing valuable secrets from deep within the subconscious during the dream state.",
        genres: ["Action", "Science Fiction", "Adventure"],
        director: "Christopher Nolan",
        cast: ["Leonardo DiCaprio", "Joseph Gordon-Levitt", "Elliot Page", "Tom Hardy", "Ken Watanabe"],
      },
      {
        title: "Parasite",
        year: "2019",
        certification: "R",
        explanation: "A darkly comic masterpiece about class inequality that pivots, without warning, into something far more sinister.",
        movie_poster: "/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg",
        overview: "All unemployed, Ki-taek's family takes a peculiar interest in the wealthy Park family and starts to infiltrate their household by posing as unrelated, highly qualified individuals.",
        genres: ["Comedy", "Thriller", "Drama"],
        director: "Bong Joon-ho",
        cast: ["Song Kang-ho", "Lee Sun-kyun", "Cho Yeo-jeong", "Choi Woo-shik", "Park So-dam"],
      },
      {
        title: "Everything Everywhere All at Once",
        year: "2022",
        certification: "R",
        explanation: "A wildly inventive multiverse adventure grounded in the emotional core of an immigrant mother-daughter relationship.",
        movie_poster: "/w3LxiVYdWWRvEVdn5RYq6jIqkb1.jpg",
        overview: "An aging Chinese immigrant is swept up in an insane adventure where she alone can save the world by exploring other universes and the lives she could have led.",
        genres: ["Action", "Adventure", "Science Fiction"],
        director: "Daniel Kwan",
        cast: ["Michelle Yeoh", "Stephanie Hsu", "Ke Huy Quan", "Jamie Lee Curtis"],
      },
      {
        title: "The Favourite",
        year: "2018",
        certification: "R",
        explanation: "A vicious, wickedly funny period drama about power, manipulation, and the cruelty dressed up as loyalty.",
        movie_poster: "/9PqD3wSIjntyJDBzMNuxuKHwpUD.jpg",
        overview: "In early 18th century England, a frail Queen Anne occupies the throne and her close friend Lady Sarah governs the country in her stead. When a new servant, Abigail, arrives, her charm endears her to Sarah.",
        genres: ["Drama", "History", "Comedy"],
        director: "Yorgos Lanthimos",
        cast: ["Olivia Colman", "Emma Stone", "Rachel Weisz", "Nicholas Hoult"],
      },
      {
        title: "Stalker",
        year: "1979",
        certification: "NR",
        explanation: "Tarkovsky's hypnotic meditation on faith, desire, and the unknowable — cinema as a slow-burning spiritual experience.",
        movie_poster: null,
        overview: "A guide leads two men — a writer and a professor — through a hazardous forbidden zone to find a room rumoured to grant one's innermost desires.",
        genres: ["Drama", "Science Fiction"],
        director: "Andrei Tarkovsky",
        cast: ["Aleksandr Kajdanovsky", "Anatoliy Solonitsyn", "Nikolay Grinko"],
      },
    ];

    // Keyed by "title|year" → Promise<data>. Storing promises means an in-flight
    // prefetch and a direct fetch triggered by opening the overlay share the same
    // request — no duplicate network calls.
    const streamingCache = new Map();

    // ── Pivot search ────────────────────────────────────────────────
    // Pre-fills the search box with a generated query and auto-submits it.
    // Used by "More like this", director, and cast links.
    // Does NOT call closeOverlay() — the form submit handler closes the overlay
    // UI directly (without history.back()) to avoid a race between history.back()
    // and the subsequent history.pushState() for the new search.
    function triggerSearch(query) {
      input.value = query;
      form.requestSubmit();
    }

    // ── Rotating placeholder ─────────────────────────────────────────

    fetch("hints.json")
      .then((r) => r.json())
      .then((hints) => {
        if (!hints.length) return;
        let i = Math.floor(Math.random() * hints.length);
        input.placeholder = hints[i];
        setInterval(() => {
          i = (i + 1) % hints.length;
          input.placeholder = hints[i];
        }, 4000);
      })
      .catch(() => { }); // silently keep the hardcoded fallback placeholder

    // ── Region detection ─────────────────────────────────────────────
    // URL param (?country=GB) takes precedence — useful for testing and VPN workarounds.
    // Otherwise, /region resolves the client IP to a country code on page load so the
    // result is ready before the user finishes typing their first query.

    const _urlCountry = new URLSearchParams(window.location.search).get("country");
    let userCountry = _urlCountry || "US";

    if (_urlCountry) {
      console.debug("[region] source=url country=" + userCountry);
    } else {
      fetch("/region")
        .then((r) => r.json())
        .then((d) => {
          userCountry = d.country || "US";
          console.debug("[region] source=ip country=" + userCountry);
        })
        .catch(() => {
          console.debug("[region] source=fallback country=US");
        });
    }

    // Simulates a real search response using MOCK_RESULTS, emitting one
    // result at a time through the same appendResult() path used by live
    // searches so all rendering and interaction code is exercised identically.
    async function runMockSearch() {
      for (let i = 0; i < MOCK_RESULTS.length; i++) {
        await new Promise(r => setTimeout(r, 180));
        if (i === 0) setLoading(false);
        appendResult(MOCK_RESULTS[i], i);
      }
      setStatus(`${MOCK_RESULTS.length} matches for "${MOCK_QUERY}" (mock)`);
      history.replaceState(
        { type: "search", query: MOCK_QUERY, results: allResults.slice(), scrollY: 0 },
        "", location.href
      );
      batchPrefetchStreamingProviders(allResults);
    }

    // ── Search ──────────────────────────────────────────────────────

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      // Close overlay DOM without touching history — handles pivot-from-overlay.
      closeOverlayUI();

      // New history entry for this search; results backfilled on "done".
      history.pushState(
        { type: "search", query, results: [], scrollY: window.scrollY },
        "", "?q=" + encodeURIComponent(query)
      );

      setLoading(true);
      clearResults();
      setStatus("");

      let resultCount = 0;

      try {
        if (query === MOCK_QUERY) {
          await runMockSearch();
          return;
        }

        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server error (${res.status})`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            let event;
            try { event = JSON.parse(line.slice(6)); } catch { continue; }

            if (event.type === "result") {
              if (resultCount === 0) setLoading(false);
              appendResult(event, resultCount);
              resultCount++;
            } else if (event.type === "done") {
              if (resultCount === 0) {
                setStatus(event.message || "No relevant matches found. Try a different query.");
              } else {
                setStatus(`${resultCount} match${resultCount !== 1 ? "es" : ""} for "${query}"`);
                // Cache results in history so back navigation can restore them instantly.
                history.replaceState(
                  { type: "search", query, results: allResults.slice(), scrollY: 0 },
                  "", location.href
                );
                // Batch-fetch all streaming providers now that we have the full result set.
                batchPrefetchStreamingProviders(allResults);
              }
            } else if (event.type === "error") {
              throw new Error(event.message);
            }
          }
        }

      } catch (err) {
        setStatus(err.message, true);
      } finally {
        setLoading(false);
      }
    });

    // ── Card rendering ──────────────────────────────────────────────

    function appendResult(result, i) {
      allResults.push(result);
      const idx = i;

      const card = document.createElement("div");
      card.className = "card";
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");

      const posterHtml = result.movie_poster
        ? `<div class="card-poster"><img src="https://image.tmdb.org/t/p/w185${escapeHtml(result.movie_poster)}" alt="${escapeHtml(result.title)}" loading="lazy" onerror="this.closest('.card-poster').remove()" /></div>`
        : "";

      const yearHtml = result.year
        ? `<span class="card-year">(${escapeHtml(result.year)})</span>`
        : "";

      const ratingHtml = result.certification
        ? `<span class="card-rating" id="card-rating-${idx}" title="${escapeHtml(ratingTitle(result.certification))}">${escapeHtml(result.certification)}</span>`
        : `<span class="card-rating" id="card-rating-${idx}"></span>`;

      card.innerHTML = `
        <div class="card-rank">${idx + 1}</div>
        ${posterHtml}
        <div class="card-body">
          <div class="card-title">
            <a class="card-title-link" href="#" tabindex="-1">${escapeHtml(result.title)}</a>${yearHtml}${ratingHtml}
          </div>
          <div class="card-explanation">${escapeHtml(result.explanation)}</div>
        </div>
      `;

      card.addEventListener("click", (e) => {
        e.preventDefault();
        openOverlay(idx);
      });

      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openOverlay(idx);
        }
      });

      resultsEl.appendChild(card);
    }

    // ── Overlay ─────────────────────────────────────────────────────

    function openOverlay(index) {
      overlayIndex = index;
      renderOverlay();
      backdrop.classList.add("open");
      document.body.style.overflow = "hidden";
      overlayClose.focus();

      const cur = history.state || {};
      // Snapshot scroll into the current search entry before pushing overlay on top,
      // so back-from-overlay restores the exact scroll position.
      if (cur.type === "search") {
        history.replaceState({ ...cur, scrollY: window.scrollY }, "", location.href);
      }
      history.pushState(
        { type: "overlay", query: cur.query || "", results: allResults.slice(), overlayIndex: index, scrollY: window.scrollY },
        "", "?q=" + encodeURIComponent(cur.query || "") + "&detail=" + index
      );
    }

    // DOM-only close — does not touch history. Used by form submit and popstate.
    function closeOverlayUI() {
      backdrop.classList.remove("open");
      document.body.style.overflow = "";
    }

    // Public close — used by the ✕ button, ESC, and backdrop click.
    // Consumes the overlay history entry via history.back() so the browser
    // stack stays consistent with the URL.
    function closeOverlay() {
      if (history.state && history.state.type === "overlay") {
        history.back();
      } else {
        closeOverlayUI();
      }
    }

    function renderOverlay() {
      const result = allResults[overlayIndex];
      if (!result) return;

      const posterHtml = result.movie_poster
        ? `<img src="https://image.tmdb.org/t/p/w300${escapeHtml(result.movie_poster)}" alt="${escapeHtml(result.title)}" />`
        : `<div class="overlay-poster-placeholder">&#127909;</div>`;

      const yearDisplay = result.year ? `<span class="overlay-title-year">(${escapeHtml(result.year)})</span>` : "";

      const pivotIcon = `<svg class="pivot-icon" width="16" height="13" aria-hidden="true"><use href="#icon-pivot"/></svg>`;

      const yearPart = result.year ? ` (${result.year})` : "";
      const titlePivotQuery = `More movies like ${escapeHtml(result.title)}${escapeHtml(yearPart)}`;

      const directorHtml = result.director
        ? `<div class="overlay-section">
            <div class="overlay-label">Director</div>
            <div class="overlay-text">
              <button class="more-link" title="More from this director" data-query="Movies directed by ${escapeHtml(result.director)}">${escapeHtml(result.director)}${pivotIcon}</button>
            </div>
           </div>`
        : "";

      const castHtml = result.cast && result.cast.length
        ? `<div class="overlay-section">
            <div class="overlay-label">Cast</div>
            <div class="overlay-text">
              ${result.cast.map(a => `<button class="more-link" title="More with ${escapeHtml(a)}" data-query="Movies starring ${escapeHtml(a)}">${escapeHtml(a)}${pivotIcon}</button>`).join(", ")}
            </div>
           </div>`
        : "";

      const overviewHtml = result.overview
        ? `<div class="overlay-section">
            <div class="overlay-label">Overview</div>
            <div class="overlay-text">${escapeHtml(result.overview)}</div>
           </div>`
        : "";

      const genresHtml = result.genres && result.genres.length
        ? `<div class="overlay-section">
            <div class="overlay-label">Genres</div>
            <div class="overlay-text">${result.genres.map(escapeHtml).join(", ")}</div>
           </div>`
        : "";

      const overlayRatingContent = result.certification ? escapeHtml(result.certification) : "";
      const overlayRatingTitle = result.certification ? ` title="${escapeHtml(ratingTitle(result.certification))}"` : "";

      overlayContent.innerHTML = `
        <div class="overlay-poster">${posterHtml}</div>
        <div class="overlay-info">
          <div class="overlay-title">${escapeHtml(result.title)}${yearDisplay}<span class="overlay-rating" id="overlay-rating"${overlayRatingTitle}>${overlayRatingContent}</span><button class="more-link overlay-title-pivot" title="More like this" data-query="${titlePivotQuery}">${pivotIcon}</button></div>
          ${overviewHtml}
          ${genresHtml}
          ${directorHtml}
          ${castHtml}
          <div class="overlay-section">
            <div class="overlay-label">Streaming</div>
            <div class="overlay-streaming" id="streamingProviders">
              <span class="overlay-streaming-loading">Loading…</span>
            </div>
            <div class="overlay-streaming-attribution">Streaming data powered by <a href="https://watchmode.com" target="_blank" rel="noopener">Watchmode.com</a></div>
          </div>
        </div>
      `;

      // Wire title, director, and cast pivot links
      overlayContent.querySelectorAll(".more-link").forEach(btn => {
        btn.addEventListener("click", () => triggerSearch(btn.dataset.query));
      });

      // Update dots
      overlayDots.innerHTML = allResults.map((_, i) =>
        `<button class="overlay-dot${i === overlayIndex ? " active" : ""}" data-i="${i}" aria-label="Result ${i + 1}"></button>`
      ).join("");
      overlayDots.querySelectorAll(".overlay-dot").forEach(dot => {
        dot.addEventListener("click", () => { overlayIndex = +dot.dataset.i; renderOverlay(); });
      });

      // Update arrows (desktop)
      overlayPrev.hidden = overlayIndex === 0;
      overlayNext.hidden = overlayIndex === allResults.length - 1;

      // Fetch streaming providers asynchronously
      fetchStreamingProviders(result.title, result.year || "");
    }

    // Raw network fetch — returns parsed JSON. Callers store the returned Promise
    // in streamingCache so the same request is never duplicated.
    async function fetchStreamingData(title, year) {
      const params = new URLSearchParams({ title, country: userCountry });
      if (year) params.set("year", year);
      const res = await fetch(`/streaming?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // Fired once after the SSE stream completes. Sends a single batch request for all
    // result titles and populates streamingCache so overlay opens are instant.
    async function batchPrefetchStreamingProviders(results) {
      if (!results.length) return;
      try {
        const titles = results.map(r => ({ title: r.title, year: r.year || "" }));
        const res = await fetch("/streaming/batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ titles, country: userCountry }),
        });
        if (!res.ok) return;
        const data = await res.json();
        for (const item of data.results) {
          const key = `${item.title}|${item.year || ""}|${userCountry}`;
          // Don't overwrite an in-flight or already-resolved entry (e.g., user opened
          // an overlay before the batch completed and a direct fetch is underway).
          if (!streamingCache.has(key)) {
            streamingCache.set(key, Promise.resolve({
              providers: item.providers,
            }));
          }
        }
      } catch {
        // Silently fail — fetchStreamingProviders will fall back to direct per-movie fetch
      }
    }

    // Renders streaming providers into the overlay. Uses the cache when available
    // so the overlay shows icons instantly if the prefetch already resolved.
    async function fetchStreamingProviders(title, year) {
      const container = document.getElementById("streamingProviders");
      if (!container) return;

      const key = `${title}|${year || ""}|${userCountry}`;
      // Re-use an existing Promise (resolved or in-flight) or start a new fetch.
      if (!streamingCache.has(key)) {
        streamingCache.set(key, fetchStreamingData(title, year));
      }

      try {
        const data = await streamingCache.get(key);
        if (!container.isConnected) return; // user navigated away

        if (!data.providers || data.providers.length === 0) {
          const regionName = new Intl.DisplayNames(["en"], { type: "region" }).of(userCountry) || userCountry;
          container.innerHTML = `<span class="overlay-streaming-none">Not available for streaming in ${escapeHtml(regionName)}</span>`;
          return;
        }
        const streamable = data.providers.filter(p => p.type === "sub" || p.type === "free");
        const rentable = data.providers.filter(p => p.type === "rent" || p.type === "buy");
        if (streamable.length > 0) {
          container.innerHTML = streamable.map(p => {
            const logoHtml = p.logo
              ? `<img src="${escapeHtml(p.logo)}" alt="${escapeHtml(p.name)}" onerror="this.style.display='none'" />`
              : "";
            return `<div class="overlay-provider">${logoHtml}${escapeHtml(p.name)}</div>`;
          }).join("");
        } else {
          const names = [...new Set(rentable.map(p => p.name))].join(", ");
          container.innerHTML = `<span class="overlay-streaming-none">Available to rent on ${escapeHtml(names)}.</span>`;
        }
      } catch {
        // Clear the failed entry so a later open can retry.
        streamingCache.delete(key);
        if (container.isConnected) {
          container.innerHTML = `<span class="overlay-streaming-none">Streaming info unavailable.</span>`;
        }
      }
    }

    // ── Overlay event handlers ───────────────────────────────────────

    overlayClose.addEventListener("click", closeOverlay);

    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeOverlay();
    });

    overlayPrev.addEventListener("click", () => { overlayIndex--; renderOverlay(); });
    overlayNext.addEventListener("click", () => { overlayIndex++; renderOverlay(); });

    document.addEventListener("keydown", (e) => {
      if (!backdrop.classList.contains("open")) return;
      if (e.key === "Escape") closeOverlay();
      if (e.key === "ArrowLeft" && overlayIndex > 0) { overlayIndex--; renderOverlay(); }
      if (e.key === "ArrowRight" && overlayIndex < allResults.length - 1) { overlayIndex++; renderOverlay(); }
    });

    // Touch swipe for carousel
    let touchStartX = 0;
    const overlayPanel = document.getElementById("overlayPanel");

    overlayPanel.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    overlayPanel.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) < 50) return;
      if (dx < 0 && overlayIndex < allResults.length - 1) { overlayIndex++; renderOverlay(); }
      if (dx > 0 && overlayIndex > 0) { overlayIndex--; renderOverlay(); }
    }, { passive: true });

    // ── Back/forward navigation (History API) ────────────────────────

    window.addEventListener("popstate", (e) => {
      const state = e.state;

      if (!state || state.type === "empty") {
        closeOverlayUI();
        clearResults();
        input.value = "";
        setStatus("");
        window.scrollTo(0, 0);
        return;
      }

      if (state.type === "overlay") {
        // Restore results if we've navigated away to a different search
        if (state.query !== input.value || allResults.length === 0) {
          restoreResults(state.results, state.query);
        }
        overlayIndex = state.overlayIndex;
        renderOverlay();
        backdrop.classList.add("open");
        document.body.style.overflow = "hidden";
        return;
      }

      if (state.type === "search") {
        closeOverlayUI();
        if (state.query !== input.value || allResults.length === 0) {
          restoreResults(state.results, state.query);
        }
        window.scrollTo(0, state.scrollY || 0);
      }
    });

    // ── Utilities ───────────────────────────────────────────────────

    function setLoading(loading) {
      btn.disabled = loading;
      spinner.style.display = loading ? "block" : "none";
    }

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "error" : "";
    }

    function clearResults() {
      resultsEl.innerHTML = "";
      allResults = [];
    }

    function restoreResults(results, query) {
      clearResults();
      input.value = query || "";
      results.forEach((r, i) => appendResult(r, i));
      if (results.length) {
        setStatus(`${results.length} match${results.length !== 1 ? "es" : ""} for "${query}"`);
      } else {
        setStatus("");
      }
    }

    const RATING_LABELS = {
      "G":     "Rated G: General Audiences",
      "PG":    "Rated PG: Parental Guidance Suggested",
      "PG-13": "Rated PG-13: Parents Strongly Cautioned",
      "R":     "Rated R: Restricted",
      "NC-17": "Rated NC-17: Adults Only",
      "NR":    "Not Rated",
    };

    function ratingTitle(certification) {
      return RATING_LABELS[certification] || "Not Rated";
    }

    function updateCardRating(idx, certification) {
      const el = document.getElementById(`card-rating-${idx}`);
      if (el && certification) {
        el.textContent = certification;
        el.title = ratingTitle(certification);
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ── History init ─────────────────────────────────────────────────
    // Let popstate manage scroll; disable the browser's automatic restoration.
    history.scrollRestoration = "manual";
    // Stamp the initial entry so back from the first search lands on a clean blank page.
    history.replaceState({ type: "empty" }, "", location.href);
    // Auto-run a search for ?q= deep links and page refreshes.
    (function () {
      const q = new URLSearchParams(location.search).get("q");
      if (q) {
        input.value = q;
        form.requestSubmit();
      }
    })();
  </script>

</body>
