<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieMatch</title>
  <!--
    Favicon: the "More like this" pivot star (reuses the #icon-pivot geometry below,
    scaled to fit a 32x32 disc with the same -10deg tilt). Rendered as an inline data: URI
    so the app stays a self-contained single file (no StaticFiles mount, works from
    file://). Dark disc (#0f0f0f, the app background) + light star (#e8e8e8) so it reads
    identically on light and dark browser chrome, unlike the muted in-app currentColor
    mark; inner facets lightened to #8a8a8a to stay visible against the dark disc.
    Note: '#' in the SVG colors must be encoded as %23 — a literal '#' would start a
    URI fragment and truncate the markup.
  -->
  <link rel="icon" type="image/svg+xml"
    href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="%230f0f0f"/><g transform="rotate(-10 16 16)" fill="%23e8e8e8"><path d="M16 4 L18.6 13.4 L28 16 L18.6 18.6 L16 28 L13.4 18.6 L4 16 L13.4 13.4 Z"/><path d="M16 16 L16 4 L18.6 13.4 Z" fill="%238a8a8a"/><path d="M16 16 L28 16 L18.6 18.6 Z" fill="%238a8a8a"/><path d="M16 16 L16 28 L13.4 18.6 Z" fill="%238a8a8a"/><path d="M16 16 L4 16 L13.4 13.4 Z" fill="%238a8a8a"/></g></svg>'>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 36px;
    }

    /* The title doubles as a "home" link back to a clean search page. */
    header h1 a {
      color: inherit;
      text-decoration: none;
    }

    header h4 {
      margin-top: 8px;
      font-size: 1.8rem;
      color: #888;
    }

    header p {
      margin-top: 8px;
      font-size: 1rem;
      font-style: italic;
      color: #888;
    }

    .search-form {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 48px;
    }

    /* Wraps the input so the clear button can overlay its right edge. */
    .input-wrap {
      flex: 1;
      position: relative;
      display: flex;
    }

    .search-form input {
      width: 100%;
      /* Extra right padding leaves room for the clear button. */
      padding: 14px 40px 14px 18px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #e8e8e8;
      outline: none;
      transition: border-color 0.2s;
    }

    /* Small "x" pinned to the right end of the input; toggled via [hidden] in JS.
       Scoped under .search-form to override the shared `.search-form button`
       styling (which otherwise gives it a white box + padding). */
    .search-form .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: #444;
      /* Sized so the × glyph fills ~40% of the input height. */
      font-size: 1.6rem;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      transition: color 0.2s;
    }

    .search-form .clear-btn:hover {
      background: none;
      color: #999;
    }

    .search-form .clear-btn[hidden] {
      display: none;
    }

    .search-form input::placeholder {
      color: #555;
    }

    .search-form input:focus {
      border-color: #555;
    }

    .search-form button {
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: #e8e8e8;
      color: #0f0f0f;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    .search-form button:hover {
      background: #fff;
    }

    .search-form button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 32px;
      min-height: 1.2em;
    }

    #status.error {
      color: #e05c5c;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease both;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .card:hover {
      border-color: #444;
      background: #1f1f1f;
    }

    .card-poster {
      width: 60px;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
      background: #2a2a2a;
      aspect-ratio: 2/3;
    }

    .card-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Shown when a poster is missing (no path stored) or 404s at the TMDB origin. */
    .card-poster-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 1.4rem;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-rank {
      font-size: 0.85rem;
      font-weight: 700;
      color: #444;
      min-width: 24px;
      padding-top: 2px;
    }

    .card-body {
      flex: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }

    .card-title-link {
      color: inherit;
      text-decoration: none;
    }

    /* Title and year live in one wrapper with a real space between them (not a
       margin gap), so a single hover underline runs continuously across both —
       no un-underlined gap in the middle. The whole card is clickable, so
       hovering anywhere in the title row triggers it. */
    .card-title:hover .card-title-name {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .card-year {
      font-weight: 600;
      color: #fff;
      font-size: 0.95rem;
    }

    .card-certification {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #888;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 7px;
      vertical-align: middle;
      letter-spacing: 0.03em;
    }

    .card-certification:empty {
      display: none;
    }

    /* Distinct from the bordered .card-certification chip so an unknown certification
       never reads as an actual rating badge — muted, italic, no border. */
    .card-certification-none {
      display: inline-block;
      font-size: 0.68rem;
      font-style: italic;
      color: #666;
      margin-left: 7px;
      vertical-align: middle;
    }

    .card-explanation {
      font-size: 0.9rem;
      color: #888;
      line-height: 1.5;
    }

    /* Clickable director / cast names inside the detail overlay */
    .more-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }

    .more-link:hover {
      color: #ddd;
    }

    /* Pivot icon shared by card button and overlay links */
    .pivot-icon {
      flex-shrink: 0;
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid #333;
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Overlay ─────────────────────────────────────────────────── */

    .overlay-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .overlay-backdrop.open {
      display: flex;
    }

    .overlay-panel {
      position: relative;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      width: min(640px, calc(100vw - 32px));
      height: min(520px, calc(100vh - 64px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: overlayIn 0.2s ease both;
    }

    .overlay-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 32px 32px 24px;
    }

    @keyframes overlayIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .overlay-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #555;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    .overlay-close:hover {
      color: #e8e8e8;
      background: #2a2a2a;
    }

    .overlay-content {
      display: flex;
      gap: 24px;
    }

    .overlay-poster {
      flex-shrink: 0;
      width: 120px;
      border-radius: 10px;
      overflow: hidden;
      background: #2a2a2a;
      aspect-ratio: 2/3;
      align-self: flex-start;
    }

    .overlay-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay-poster-placeholder {
      width: 100%;
      height: 100%;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 2rem;
    }

    .overlay-info {
      flex: 1;
      min-width: 0;
    }

    .overlay-title-pivot {
      margin-left: 6px;
      vertical-align: middle;
      /* Grey at rest, brighten on hover — reversed from the title's white
         default so the icon doesn't compete with the title text. Comes after
         .more-link:hover in source order, so it wins on equal specificity. */
      color: #888;
    }

    .overlay-title-pivot:hover {
      color: #fff;
    }

    /* Share button — sits just right of the pivot star. Same grey-at-rest /
       white-on-hover treatment, but sized in rem to match the MPAA cert chip's
       fixed scale, so it reads as a lighter, secondary affordance. position:relative anchors the
       transient "Copied!" bubble shown on the desktop copy-link fallback. */
    .overlay-title-share {
      margin-left: 4px;
      vertical-align: middle;
      color: #888;
      position: relative;
    }

    .overlay-title-share:hover {
      color: #fff;
    }

    /* Desktop "Copied!" confirmation bubble (toggled by the .copied class for ~1.4s
       after a clipboard write). Mobile uses the native share sheet and never shows this. */
    .overlay-title-share.copied::after {
      content: "Copied!";
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 6px;
      background: #333;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
    }

    .overlay-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .overlay-title-year {
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
      margin-left: 8px;
    }

    .overlay-certification {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #888;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 8px;
      vertical-align: middle;
      letter-spacing: 0.03em;
    }

    .overlay-certification:empty {
      display: none;
    }

    /* Muted, italic, borderless — an unknown certification must not look like a rating chip. */
    .overlay-certification-none {
      display: inline-block;
      font-size: 0.72rem;
      font-style: italic;
      color: #666;
      margin-left: 8px;
      vertical-align: middle;
    }

    .overlay-section {
      margin-bottom: 14px;
    }

    .overlay-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin-bottom: 4px;
    }

    .overlay-text {
      font-size: 0.9rem;
      color: #b0b0b0;
      line-height: 1.55;
    }

    .overlay-streaming {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    /* Rendered as an <a> when we have a deep link to the title on that provider,
       and as a plain <div> when we don't (e.g. the TMDB fallback, which only offers
       one shared JustWatch link per film rather than a per-provider one). Both share
       this rule so the two cases are visually identical apart from the hover. */
    .overlay-provider {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #242424;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.82rem;
      color: #ccc;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }

    /* Hover only on the linked variant — matches the Reviews score chips. */
    a.overlay-provider:hover {
      background: #2c2c2c;
      border-color: #555;
    }

    .overlay-provider img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
    }

    /* Rent/buy amount, trailing the provider name inside the chip. */
    .overlay-provider-price {
      color: #888;
      font-size: 0.78rem;
    }

    .overlay-streaming-loading {
      font-size: 0.85rem;
      color: #555;
      font-style: italic;
    }

    .overlay-streaming-none {
      font-size: 0.85rem;
      color: #b0b0b0;
    }

    .overlay-streaming-attribution {
      width: 100%;
      margin-top: 6px;
      font-size: 0.72rem;
      color: #555;
    }

    .overlay-streaming-attribution a {
      color: #555;
      text-decoration: none;
    }

    .overlay-streaming-attribution a:hover {
      text-decoration: underline;
    }

    /* ── Reviews (critic/audience scores) ─────────────────────────────
       Row of clickable provider chips, styled to match .overlay-streaming
       so the two adjacent sections read as one visual family. */
    .overlay-scores {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    /* Each score is an <a> to the provider's page: brand glyph + score value. */
    .overlay-score {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #242424;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 0.9rem;
      color: #ddd;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .overlay-score:hover {
      background: #2c2c2c;
      border-color: #555;
    }

    /* Wordmark glyphs (IMDb/TMDB) are wider than the square ones (RT/MC); each
       <use> sets its own width so aspect ratio is preserved — height is uniform. */
    .overlay-score-icon {
      height: 20px;
      display: block;
    }

    .overlay-score-value {
      line-height: 1;
    }

    .overlay-scores-loading {
      font-size: 0.85rem;
      color: #555;
      font-style: italic;
    }

    .overlay-scores-none {
      font-size: 0.85rem;
      color: #b0b0b0;
    }

    footer {
      margin-top: 48px;
      font-size: 0.85rem;
    }

    footer a {
      color: #888;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* ── Carousel nav ────────────────────────────────────────────── */

    .overlay-frame {
      position: relative;
      display: flex;
      align-items: center;
      width: min(640px, calc(100vw - 32px));
    }

    .overlay-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 14px 32px 18px;
      border-top: 1px solid #2a2a2a;
    }

    .overlay-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .overlay-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: none;
      background: #3a3a3a;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s, transform 0.15s;
    }

    .overlay-dot.active {
      background: #ccc;
      transform: scale(1.25);
    }

    .overlay-dot:hover:not(.active) {
      background: #666;
    }

    .overlay-arrow {
      display: none;
    }

    @media (min-width: 521px) {
      .overlay-arrow {
        display: flex;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 50%;
        color: #aaa;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, opacity 0.15s;
        padding: 0;
      }

      .overlay-arrow:hover {
        background: #2e2e2e;
        color: #fff;
      }

      .overlay-arrow[hidden] {
        visibility: hidden;
        pointer-events: none;
      }

      .overlay-arrow-prev {
        right: calc(100% + 12px);
      }

      .overlay-arrow-next {
        left: calc(100% + 12px);
      }
    }

    /* ── Mobile ──────────────────────────────────────────────────── */

    @keyframes overlaySlideUp {
      from {
        transform: translateY(100%);
        opacity: 1;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 32px 16px;
      }

      header h1 {
        font-size: 2rem;
        margin-bottom: 16px;
      }

      header h4 {
        font-size: 1.2rem;
      }

      .search-form {
        margin-bottom: 32px;
      }

      .card {
        padding: 14px 16px;
        gap: 12px;
      }

      .overlay-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 88vh;
        border-radius: 20px 20px 0 0;
        animation: overlaySlideUp 0.25s ease both;
      }

      .overlay-scroll {
        padding: 20px 16px 16px;
      }

      .overlay-nav {
        padding: 10px 16px 20px;
      }

      .overlay-close {
        top: 12px;
        right: 12px;
      }

      .overlay-poster {
        width: 80px;
      }

      .overlay-title {
        font-size: 1.1rem;
      }

      .overlay-nav-btn {
        padding: 8px 12px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>

<body>

  <!-- Reusable SVG symbols — hidden, referenced via <use> throughout the page -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
    <!--
      "More like this" pivot icon: a four-point sparkle/compass star, slightly
      rotated, with two-tone facets suggesting a gem or guiding star.
      Uses currentColor so the icon inherits the surrounding link color (and
      brightens with .more-link:hover). The inner facets render in a fixed
      gray (#666) rather than an opacity blend, so the two-tone contrast
      stays constant regardless of what's behind the icon — dark enough to
      read clearly against the #888 resting link color, not just on hover.
    -->
    <symbol id="icon-pivot" viewBox="0 0 20 20" fill="currentColor">
      <g transform="rotate(-10 10 10)">
        <path d="M10,2.5 L11.6,8.4 L17.5,10 L11.6,11.6 L10,17.5 L8.4,11.6 L2.5,10 L8.4,8.4 Z" />
        <path d="M10,10 L10,2.5 L11.6,8.4 Z" style="color:#666" />
        <path d="M10,10 L17.5,10 L11.6,11.6 Z" style="color:#666" />
        <path d="M10,10 L10,17.5 L8.4,11.6 Z" style="color:#666" />
        <path d="M10,10 L2.5,10 L8.4,8.4 Z" style="color:#666" />
      </g>
    </symbol>

    <!--
      Share icon: a two-link chain — the "copy / share link" metaphor for the overlay
      share button. Stroke-based (unlike the filled pivot star) so it reads as a lighter,
      secondary affordance next to it; inherits currentColor for the same #888 -> #fff hover.
      Authored in a 0 0 24 24 box (viewBox differs per symbol, like the provider glyphs below).
    -->
    <symbol id="icon-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M15 7h2a5 5 0 0 1 0 10h-2" />
      <path d="M9 17H7A5 5 0 0 1 7 7h2" />
      <line x1="8" y1="12" x2="16" y2="12" />
    </symbol>

    <!--
      Reviews-section provider glyphs, drawn inline so the overlay needs no image assets:
      IMDb and TMDB are wordmarks (wide viewBox), Rotten Tomatoes and Metacritic are square
      icons (square viewBox — see the width note on .overlay-score-icon below). IMDb/TMDB/RT
      are simplified, recognizable approximations rather than pixel-exact logos; the
      Metacritic "m" is the one exception, using the official vector paths because its
      stepped letterform cannot be approximated with a font glyph.
      Each is wrapped in an <a> to the provider's page and labelled via a title tooltip.
    -->
    <symbol id="icon-rt" viewBox="0 0 24 24">
      <!-- tomato body + two leaves + stem -->
      <circle cx="12" cy="14.5" r="7.5" fill="#FA320A" />
      <path d="M12 8 C11 5.5 8.5 4.5 6.5 5 C7.5 7 9.5 8 12 8 Z" fill="#3A9E1E" />

  <header>
    <h1><a href="/">MovieMatch</a></h1>
    <h4>What would you like to watch today?</h4>
    <p>Describe what you're in the mood for and we'll find the best matches.</p>
  </header>

  <form class="search-form" id="searchForm">
    <div class="input-wrap">
      <input type="text" id="queryInput" placeholder="Describe what you're in the mood for…" autocomplete="off"
        autofocus />
      <!-- Clears the query; shown only while the input is non-empty (toggled in JS). -->
      <button type="button" id="clearBtn" class="clear-btn" aria-label="Clear query" hidden>&times;</button>
    </div>

  <div id="status"></div>
  <div class="spinner" id="spinner"></div>
  <div class="results" id="results"></div>

  <footer>
    <a href="https://github.com/jenny/moviematch" target="_blank" rel="noopener">Built with Claude Code</a>
  </footer>

  <!-- Detail overlay -->
  <div class="overlay-backdrop" id="overlayBackdrop" role="dialog" aria-modal="true">
    <div class="overlay-frame">
      <button class="overlay-arrow overlay-arrow-prev" id="overlayPrev" aria-label="Previous">&#8249;</button>
      <div class="overlay-panel" id="overlayPanel">
        <button class="overlay-close" id="overlayClose" aria-label="Close">&times;</button>
        <div class="overlay-scroll">
          <div class="overlay-content" id="overlayContent"></div>
        </div>
        <div class="overlay-nav">
          <div class="overlay-dots" id="overlayDots"></div>
        </div>
      </div>
      <button class="overlay-arrow overlay-arrow-next" id="overlayNext" aria-label="Next">&#8250;</button>
    </div>
  </div>

  <script>
    const API_URL = "/recommend";

    const form = document.getElementById("searchForm");
    const input = document.getElementById("queryInput");
    const clearBtn = document.getElementById("clearBtn");
    const btn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const spinner = document.getElementById("spinner");
    const resultsEl = document.getElementById("results");
    const backdrop = document.getElementById("overlayBackdrop");
    const overlayContent = document.getElementById("overlayContent");
    const overlayClose = document.getElementById("overlayClose");
    const overlayPrev = document.getElementById("overlayPrev");
    const overlayNext = document.getElementById("overlayNext");
    const overlayDots = document.getElementById("overlayDots");

    // Show the clear "x" only when the input has text. Call this anywhere
    // input.value is changed programmatically so the button stays in sync.
    function toggleClearBtn() {
      clearBtn.hidden = input.value.length === 0;
    }

    // Live-toggle as the user types, and wire the clear action.
    input.addEventListener("input", toggleClearBtn);
    clearBtn.addEventListener("click", () => {
      input.value = "";
      toggleClearBtn();
      input.focus();
    });

    let allResults = [];
    let overlayIndex = 0;
    // Set by the ?detail= deep-link runner (bottom of file), consumed once after the
    // deep-linked search's results render so we can auto-open that movie's overlay.
    let pendingDetailOpen = null;

    // ── Mock search (dev only) ───────────────────────────────────────
    // Type "__mock__" as the query to bypass the backend entirely and
    // render fake results through the same code path as real searches.
    // Useful for front-end-only changes (styling, layout, icons, etc.)
    // without needing a running server.
    //
    // Everything the mock needs lives between here and "End mock" below, so
    // it can be read (or ignored) as one unit. Fixtures carry inline
    // `providers` and `scores` so NO network call is made — see runMockSearch.
    const MOCK_QUERY = "__mock__";

    const MOCK_RESULTS = [
      {
        title: "Inception",
        year: "2010",
        certification: "PG-13",
        explanation: "A thief who steals corporate secrets through dream-sharing is given the inverse task of planting an idea — layered, kinetic, and endlessly rewatchable.",
        movie_poster: "/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg",
        overview: "Dom Cobb is a skilled thief, the absolute best in the dangerous art of extraction: stealing valuable secrets from deep within the subconscious during the dream state, when the mind is at its most vulnerable. Cobb's rare ability has made him a coveted player in this treacherous new world of corporate espionage, but it has also made him an international fugitive and cost him everything he has ever loved. Now Cobb is being offered a chance at redemption — one last job that could give him his life back, but only if he can accomplish the impossible: inception, planting an idea into a target's mind rather than stealing one.",
        genres: ["Action", "Science Fiction", "Adventure"],
        director: "Christopher Nolan",
        cast: ["Leonardo DiCaprio", "Joseph Gordon-Levitt", "Elliot Page", "Tom Hardy", "Ken Watanabe"],
        // Subscription-streamable — the primary provider-chip render path (linked chips).
        providers: [
          { type: "sub", name: "Netflix", logo: "https://image.tmdb.org/t/p/original/pbpMk2JmcoNnQwx5JGpXngfoWtp.jpg", url: "https://www.netflix.com/title/70131314" },
          { type: "sub", name: "Max", logo: "https://image.tmdb.org/t/p/original/6Q3ZYUNA9Hsgj6iWnVsw2gR5V6z.jpg", url: "https://www.max.com/movies/inception" },
        ],
        scores: [
          { provider: "rt", score: "87%", url: "https://www.rottentomatoes.com/search?search=Inception" },
          { provider: "imdb", score: "8.8", url: "https://www.imdb.com/title/tt1375666/" },
          { provider: "metacritic", score: "74", url: "https://www.metacritic.com/search/Inception/" },
          { provider: "tmdb", score: "8.4", url: "https://www.themoviedb.org/movie/27205" },
        ],
      },
      {
        title: "Parasite",
        year: "2019",
        certification: "R",
        explanation: "A darkly comic masterpiece about class inequality that pivots, without warning, into something far more sinister.",
        movie_poster: "/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg",
        overview: "All unemployed, Ki-taek's family takes a peculiar interest in the wealthy Park family, and starts to infiltrate their household one by one, each posing as an unrelated, highly qualified individual. Ki-woo lands a well-paid tutoring job through a friend's recommendation, then schemes to bring the rest of his family into the Parks' employ. Their symbiotic arrangement holds until a startling discovery hidden within the house threatens to unravel everything, pulling both families into a spiral of greed, deception, and violence from which there may be no return.",
        genres: ["Comedy", "Thriller", "Drama"],
        director: "Bong Joon-ho",
        cast: ["Song Kang-ho", "Lee Sun-kyun", "Cho Yeo-jeong", "Choi Woo-shik", "Park So-dam"],
        // Mixed sub + rent — streamable wins, so the rent entries stay hidden.
        providers: [
          { type: "sub", name: "Hulu", logo: "https://image.tmdb.org/t/p/original/zxrVdFjIjLqkfnwyghnfywTn3Lh.jpg", url: "https://www.hulu.com/movie/parasite" },
          { type: "rent", name: "Apple TV", logo: "https://image.tmdb.org/t/p/original/peURlLlr8jggOwK53fJ5wdQl05y.jpg", url: "https://tv.apple.com/movie/parasite", price: 3.99 },
        ],
        scores: [
          { provider: "rt", score: "99%", url: "https://www.rottentomatoes.com/search?search=Parasite" },
          { provider: "imdb", score: "8.5", url: "https://www.imdb.com/title/tt6751668/" },
          { provider: "metacritic", score: "96", url: "https://www.metacritic.com/search/Parasite/" },
          { provider: "tmdb", score: "8.5", url: "https://www.themoviedb.org/movie/496243" },
        ],
      },
      {
        title: "Everything Everywhere All at Once",
        year: "2022",
        certification: "R",
        explanation: "A wildly inventive multiverse adventure grounded in the emotional core of an immigrant mother-daughter relationship.",

        overview: "An aging Chinese immigrant is swept up in an insane adventure where she alone can save the world by exploring other universes and the lives she could have led.",
        genres: ["Action", "Adventure", "Science Fiction"],
        director: "Daniel Kwan",
        cast: ["Michelle Yeoh", "Stephanie Hsu", "Ke Huy Quan", "Jamie Lee Curtis"],
        // Free tier counts as streamable alongside "sub".
        providers: [
          { type: "free", name: "Prime Video", logo: "https://image.tmdb.org/t/p/original/emthp39XA2YScoYL1p0sdbAH2WA.jpg", url: "https://www.primevideo.com/detail/everything-everywhere-all-at-once" },
        ],
        scores: [
          { provider: "rt", score: "93%", url: "https://www.rottentomatoes.com/search?search=Everything+Everywhere+All+at+Once" },
          { provider: "imdb", score: "7.8", url: "https://www.imdb.com/title/tt6710474/" },
          { provider: "metacritic", score: "81", url: "https://www.metacritic.com/search/Everything%20Everywhere%20All%20at%20Once/" },
          { provider: "tmdb", score: "7.8", url: "https://www.themoviedb.org/movie/545611" },
        ],
      },
      {
        title: "The Favourite",
        year: "2018",
        certification: "R",
        explanation: "A vicious, wickedly funny period drama about power, manipulation, and the cruelty dressed up as loyalty.",
        movie_poster: "/9PqD3wSIjntyJDBzMNuxuKHwpUD.jpg",
        overview: "In early 18th century England, a frail Queen Anne occupies the throne and her close friend Lady Sarah governs the country in her stead. When a new servant, Abigail, arrives, her charm endears her to Sarah.",
        genres: ["Drama", "History", "Comedy"],
        director: "Yorgos Lanthimos",
        cast: ["Olivia Colman", "Emma Stone", "Rachel Weisz", "Nicholas Hoult"],
        // Rent/buy only — exercises the promoted-chip branch and the relabelled heading.
        providers: [
          // Rent + buy with no subscription option: drives the promoted-chip branch and the
          // "Available to rent or buy" heading. Prime Video carries no price on purpose —
          // Watchmode sometimes omits it, and the chip must still render.
          { type: "rent", name: "Apple TV", logo: "https://image.tmdb.org/t/p/original/peURlLlr8jggOwK53fJ5wdQl05y.jpg", url: "https://tv.apple.com/movie/the-favourite", price: 3.99 },
          { type: "buy", name: "Prime Video", logo: "https://image.tmdb.org/t/p/original/emthp39XA2YScoYL1p0sdbAH2WA.jpg", url: "https://www.primevideo.com/detail/the-favourite" },
        ],
        scores: [
          { provider: "rt", score: "92%", url: "https://www.rottentomatoes.com/search?search=The+Favourite" },
          { provider: "imdb", score: "7.5", url: "https://www.imdb.com/title/tt5083738/" },
          { provider: "metacritic", score: "90", url: "https://www.metacritic.com/search/The%20Favourite/" },
          { provider: "tmdb", score: "7.5", url: "https://www.themoviedb.org/movie/375262" },
        ],
      },
      {
        title: "Stalker",
        year: "1979",
        certification: "NR",
        explanation: "Tarkovsky's hypnotic meditation on faith, desire, and the unknowable — cinema as a slow-burning spiritual experience.",
        movie_poster: null,
        overview: "A guide leads two men — a writer and a professor — through a hazardous forbidden zone to find a room rumoured to grant one's innermost desires.",
        genres: ["Drama", "Science Fiction"],
        director: "Andrei Tarkovsky",
        cast: ["Aleksandr Kajdanovsky", "Anatoliy Solonitsyn", "Nikolay Grinko"],
        // Empty — exercises the "Not available for streaming in <region>" path.
        providers: [],
        // Partial set (no Metacritic) — exercises the "some providers absent" render path.
        scores: [
          { provider: "rt", score: "100%", url: "https://www.rottentomatoes.com/search?search=Stalker" },
          { provider: "imdb", score: "8.1", url: "https://www.imdb.com/title/tt0079944/" },
          { provider: "tmdb", score: "8.2", url: "https://www.themoviedb.org/movie/1398" },
        ],
      },
    ];

    // Simulates a real search response using MOCK_RESULTS, emitting one
    // result at a time through the same appendResult() path used by live
    // searches so all rendering and interaction code is exercised identically.
    async function runMockSearch() {
      for (let i = 0; i < MOCK_RESULTS.length; i++) {
        await new Promise(r => setTimeout(r, 180));
        if (i === 0) setLoading(false);
        appendResult(MOCK_RESULTS[i], i);
      }
      setStatus(`${MOCK_RESULTS.length} matches for "${MOCK_QUERY}" (mock)`);
      history.replaceState(
        { type: "search", query: MOCK_QUERY, results: allResults.slice(), scrollY: 0 },
        "", location.href
      );
      // Deliberately NOT calling batchPrefetchStreamingProviders() — it POSTs to
      // /streaming/batch and hits the Watchmode API, defeating the offline mock.
      // The fixtures carry inline `providers`, which renderStreamingProviders()
      // short-circuits on (same as renderScores() with `scores`), so overlays
      // render streaming without any network call.
    }
    // ── End mock ─────────────────────────────────────────────────────

    // Keyed by "title|year" → Promise<data>. Storing promises means an in-flight
    // prefetch and a direct fetch triggered by opening the overlay share the same
    // request — no duplicate network calls.
    const streamingCache = new Map();

    // Same promise-caching scheme for /ratings. Region-independent, so the key is
    // just "title|year" (no country, unlike streamingCache).
    const scoresCache = new Map();

    // ── Pivot search ────────────────────────────────────────────────
    // Pre-fills the search box with a generated query and auto-submits it.
    // Used by "More like this", director, and cast links.
    // Does NOT call closeOverlay() — the form submit handler closes the overlay
    // UI directly (without history.back()) to avoid a race between history.back()
    // and the subsequent history.pushState() for the new search.
    function triggerSearch(query) {
      input.value = query;
      toggleClearBtn();
      form.requestSubmit();
    }

    // ── Rotating placeholder ─────────────────────────────────────────

    fetch("hints.json")
      .then((r) => r.json())
      .then((hints) => {
        if (!hints.length) return;
        let i = Math.floor(Math.random() * hints.length);
        input.placeholder = hints[i];
        setInterval(() => {
          i = (i + 1) % hints.length;
          input.placeholder = hints[i];
        }, 4000);
      })
      .catch(() => { }); // silently keep the hardcoded fallback placeholder

    // ── Region detection ─────────────────────────────────────────────
    // URL param (?country=GB) takes precedence — useful for testing and VPN workarounds.
    // Otherwise, /region resolves the client IP to a country code on page load so the
    // result is ready before the user finishes typing their first query.

    const _urlCountry = new URLSearchParams(window.location.search).get("country");
    let userCountry = _urlCountry || "US";

    if (_urlCountry) {
      console.debug("[region] source=url country=" + userCountry);
    } else {
      fetch("/region")
        .then((r) => r.json())
        .then((d) => {
          userCountry = d.country || "US";
          console.debug("[region] source=ip country=" + userCountry);
        })
        .catch(() => {
          console.debug("[region] source=fallback country=US");
        });
    }

    // ── Search ──────────────────────────────────────────────────────

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      // Capture-and-clear the deep-link auto-open request (set by the ?detail= runner) up
      // front, so it fires only for this one search and can't leak into a later manual one.
      const detailToOpen = pendingDetailOpen;
      pendingDetailOpen = null;

      // Close overlay DOM without touching history — handles pivot-from-overlay.
      closeOverlayUI();

      // New history entry for this search; results backfilled on "done".
      history.pushState(
        { type: "search", query, results: [], scrollY: window.scrollY },
        "", "?q=" + encodeURIComponent(query)
      );

      setLoading(true);
      clearResults();
      setStatus("");

      let resultCount = 0;

      try {
        if (query === MOCK_QUERY) {
          await runMockSearch();
          maybeAutoOpenDetail(detailToOpen);  // support shared ?detail= links in mock mode too
          return;
        }

        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server error (${res.status})`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            let event;
            try { event = JSON.parse(line.slice(6)); } catch { continue; }

            if (event.type === "result") {
              if (resultCount === 0) setLoading(false);
              appendResult(event, resultCount);
              resultCount++;
            } else if (event.type === "done") {
              if (resultCount === 0) {
                setStatus(event.message || "No relevant matches found. Try a different query.");
              } else {
                setStatus(`${resultCount} match${resultCount !== 1 ? "es" : ""} for "${query}"`);
                // Cache results in history so back navigation can restore them instantly.
                history.replaceState(
                  { type: "search", query, results: allResults.slice(), scrollY: 0 },
                  "", location.href
                );
                // Batch-fetch all streaming providers now that we have the full result set.
                batchPrefetchStreamingProviders(allResults);
                // Same for review scores — warms scoresCache for instant overlay opens.
                batchPrefetchScores(allResults);
                // Deep-link auto-open: arrived via a shared ?detail= link — now that the
                // results exist, open the matching card.
                maybeAutoOpenDetail(detailToOpen);
              }
            } else if (event.type === "error") {
              throw new Error(event.message);
            }
          }
        }

      } catch (err) {
        setStatus(err.message, true);
      } finally {
        setLoading(false);
      }
    });

    // ── Card rendering ──────────────────────────────────────────────

    function appendResult(result, i) {
      allResults.push(result);
      const idx = i;

      const card = document.createElement("div");
      card.className = "card";
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");

      // Missing path OR a 404 at the TMDB origin both fall back to the film-reel glyph
      // (posterFallback swaps the broken <img> in place) rather than a blank/broken card.
      const posterHtml = result.movie_poster
        ? `<div class="card-poster"><img src="https://image.tmdb.org/t/p/w185${escapeHtml(result.movie_poster)}" alt="${escapeHtml(result.title)}" loading="lazy" onerror="posterFallback(this)" /></div>`
        : `<div class="card-poster"><div class="card-poster-placeholder">&#127909;</div></div>`;

      const yearHtml = result.year
        ? `<span class="card-year">(${escapeHtml(result.year)})</span>`
        : "";

      // Unknown certification renders as an explicit, visually-distinct note so it can't
      // be misread as an actual rating (e.g. "NR").
      const certificationHtml = result.certification
        ? `<span class="card-certification" id="card-certification-${idx}" title="${escapeHtml(certificationTitle(result.certification))}">${escapeHtml(result.certification)}</span>`
        : `<span class="card-certification-none">Rating not available</span>`;

      card.innerHTML = `
        <div class="card-rank">${idx + 1}</div>
        ${posterHtml}
        <div class="card-body">
          <div class="card-title">
            <span class="card-title-name"><a class="card-title-link" href="#" tabindex="-1">${escapeHtml(result.title)}</a>${yearHtml ? " " + yearHtml : ""}</span>${certificationHtml}
          </div>
          <div class="card-explanation">${escapeHtml(result.explanation)}</div>
        </div>
      `;

      card.addEventListener("click", (e) => {
        e.preventDefault();
        openOverlay(idx);
      });

      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openOverlay(idx);
        }
      });

      resultsEl.appendChild(card);
    }

    // ── Overlay ─────────────────────────────────────────────────────

    // Canonical "Title (Year)" key for a result. Single source of truth for the
    // ?detail= URL param, the share link, and deep-link matching, so the value the
    // share button emits and the value the load runner matches on always agree.
    function movieDetailKey(result) {
      const yearPart = result.year ? ` (${result.year})` : "";
      return `${result.title}${yearPart}`;
    }

    // Deep-link auto-open: open the result matching a "Title (Year)" key (from a shared
    // ?detail= link). Matched by key, not index, so non-deterministic result ordering can't
    // open the wrong film. No-op if key is empty or no result matches (e.g. cold reference).
    function maybeAutoOpenDetail(key) {
      if (!key) return;
      const idx = allResults.findIndex(
        r => movieDetailKey(r).toLowerCase() === key.toLowerCase()
      );
      if (idx !== -1) openOverlay(idx);
    }

    // Shareable URL for a movie: a search for "More movies like X" (hits the reference
    // guarantee so X is always in the results) plus ?detail= so the recipient lands with
    // X's card auto-opened. encodeURIComponent — not escapeHtml, which is for HTML attrs.
    function shareUrlFor(result) {
      const key = movieDetailKey(result);
      return location.origin + "/?q=" + encodeURIComponent("More movies like " + key) +
        "&detail=" + encodeURIComponent(key);
    }

    // Copy to clipboard with a legacy fallback for non-secure contexts (navigator.clipboard
    // is undefined off https/localhost). Returns whether the copy succeeded.
    async function copyLink(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(url);
        return true;
      }
      const ta = document.createElement("textarea");
      ta.value = url;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch { /* copy unsupported */ }
      document.body.removeChild(ta);
      return ok;
    }

    // Share this movie. Mobile: the native share sheet (navigator.share — a user-gesture,
    // secure-context API). Desktop (no share sheet): copy the link + a transient "Copied!"
    // confirmation on the button.
    async function shareMovie(result, btn) {
      const url = shareUrlFor(result);
      if (navigator.share) {
        // navigator.share rejects if the user dismisses the sheet — that's not an error.
        try {
          await navigator.share({
            title: movieDetailKey(result),
            text: `Check out ${result.title} on MovieMatch`,
            url,
          });
        } catch { /* dismissed */ }
        return;
      }
      const ok = await copyLink(url);
      if (ok && btn) {
        btn.classList.add("copied");
        setTimeout(() => btn.classList.remove("copied"), 1400);
      }
    }

    // Update the address bar to name the currently-open card as the user pages through the
    // carousel. Uses replaceState (NOT pushState) so no history entry is added — the "carousel
    // does not modify history / back closes the overlay in one step" invariant holds — while
    // the URL stays copy-shareable at any card. Also refreshes the stored overlayIndex so a
    // later back→forward restores the card the user actually stopped on.
    function syncOverlayUrl() {
      const cur = history.state;
      if (!cur || cur.type !== "overlay") return;
      const result = allResults[overlayIndex];
      if (!result) return;
      history.replaceState(
        { ...cur, overlayIndex },
        "",
        "?q=" + encodeURIComponent(cur.query || "") + "&detail=" + encodeURIComponent(movieDetailKey(result))
      );
    }

    // Carousel navigation (arrows, swipe, dots) funnels through here so the URL sync can't be
    // forgotten on one path. openOverlay() and popstate restore deliberately do NOT use this —
    // they manage history themselves (pushState / browser-driven), so they set overlayIndex directly.
    function navigateOverlay(index) {
      overlayIndex = index;
      renderOverlay();
      syncOverlayUrl();
    }

    function openOverlay(index) {
      overlayIndex = index;
      renderOverlay();
      backdrop.classList.add("open");
      // The scroll reset in renderOverlay() is a no-op while the backdrop is
      // display:none (a hidden element has no scroll box, so scrollTop can't be
      // set). Reset again now that .open has made it display:flex, otherwise a
      // reopened modal restores the previous movie's scroll position.
      overlayContent.parentElement.scrollTop = 0;
      document.body.style.overflow = "hidden";
      overlayClose.focus();

      const cur = history.state || {};
      // Snapshot scroll into the current search entry before pushing overlay on top,
      // so back-from-overlay restores the exact scroll position.
      if (cur.type === "search") {
        history.replaceState({ ...cur, scrollY: window.scrollY }, "", location.href);
      }
      // ?detail= carries the "Title (Year)" key (not the numeric index) so the URL is a
      // stable, shareable pointer to the film — robust to non-deterministic result ordering.
      // The numeric index still lives in the history state object for internal restore.
      history.pushState(
        { type: "overlay", query: cur.query || "", results: allResults.slice(), overlayIndex: index, scrollY: window.scrollY },
        "", "?q=" + encodeURIComponent(cur.query || "") + "&detail=" + encodeURIComponent(movieDetailKey(allResults[index]))
      );
    }

    // DOM-only close — does not touch history. Used by form submit and popstate.
    function closeOverlayUI() {
      backdrop.classList.remove("open");
      document.body.style.overflow = "";
    }

    // Public close — used by the ✕ button, ESC, and backdrop click.
    // Consumes the overlay history entry via history.back() so the browser
    // stack stays consistent with the URL.
    function closeOverlay() {
      if (history.state && history.state.type === "overlay") {
        history.back();
      } else {
        closeOverlayUI();
      }
    }

    function renderOverlay() {
      const result = allResults[overlayIndex];
      if (!result) return;

      const posterHtml = result.movie_poster
        ? `<img src="https://image.tmdb.org/t/p/w300${escapeHtml(result.movie_poster)}" alt="${escapeHtml(result.title)}" onerror="posterFallback(this)" />`
        : `<div class="overlay-poster-placeholder">&#127909;</div>`;

      const yearDisplay = result.year ? `<span class="overlay-title-year">(${escapeHtml(result.year)})</span>` : "";

      // Director/cast pivots: em-sized so they scale down to sit inline with the smaller
      // .overlay-text (0.9rem) name text. Do NOT convert these to rem — the context-scaling
      // is intentional.
      const pivotIcon = `<svg class="pivot-icon" width="1.6em" height="1.6em" style="position:relative;top:-0.15em" aria-hidden="true"><use href="#icon-pivot"/></svg>`;
      // Title pivot + share glyph: rem-sized (fixed scale) so the title-row icons track the
      // MPAA cert chip rather than the title, staying matched across the mobile breakpoint.
      // Fixed 1.6rem (tuned by eye) — was 1.6em, i.e. it scaled with the 1.4rem title before.
      const titlePivotIcon = `<svg class="pivot-icon" width="1.6rem" height="1.6rem" aria-hidden="true"><use href="#icon-pivot"/></svg>`;
      // No vertical nudge — the button's vertical-align:middle sits the link level with the
      // MPAA cert chip on its own, which reads best.
      const shareIcon = `<svg class="pivot-icon" width="1.1rem" height="1.1rem" aria-hidden="true"><use href="#icon-link"/></svg>`;

      const yearPart = result.year ? ` (${result.year})` : "";
      const titlePivotQuery = `More movies like ${escapeHtml(result.title)}${escapeHtml(yearPart)}`;

      const directorHtml = result.director
        ? `<div class="overlay-section">
            <div class="overlay-label">Director</div>
            <div class="overlay-text">
              <button class="more-link" title="More from this director" data-query="Movies directed by ${escapeHtml(result.director)}">${escapeHtml(result.director)}${pivotIcon}</button>
            </div>
           </div>`
        : "";

      const castHtml = result.cast && result.cast.length
        ? `<div class="overlay-section">
            <div class="overlay-label">Cast</div>
            <div class="overlay-text">
              ${result.cast.map(a => `<button class="more-link" title="More with ${escapeHtml(a)}" data-query="Movies starring ${escapeHtml(a)}">${escapeHtml(a)}${pivotIcon}</button>`).join(", ")}
            </div>
           </div>`
        : "";

      const overviewHtml = result.overview
        ? `<div class="overlay-section">
            <div class="overlay-label">Overview</div>
            <div class="overlay-text">${escapeHtml(result.overview)}</div>
           </div>`
        : "";

      const genresHtml = result.genres && result.genres.length
        ? `<div class="overlay-section">
            <div class="overlay-label">Genres</div>
            <div class="overlay-text">${result.genres.map(escapeHtml).join(", ")}</div>
           </div>`
        : "";

      // Chip for a known certification; muted italic note for an unknown one (never a blank/NR chip).
      const overlayCertificationHtml = result.certification
        ? `<span class="overlay-certification" id="overlay-certification" title="${escapeHtml(certificationTitle(result.certification))}">${escapeHtml(result.certification)}</span>`
        : `<span class="overlay-certification-none">Rating not available</span>`;

      overlayContent.innerHTML = `
        <div class="overlay-poster">${posterHtml}</div>
        <div class="overlay-info">
          <div class="overlay-title">${escapeHtml(result.title)}${yearDisplay}${overlayCertificationHtml}<button class="more-link overlay-title-pivot" title="More like this" data-query="${titlePivotQuery}">${titlePivotIcon}</button><button class="more-link overlay-title-share" title="Share" aria-label="Share">${shareIcon}</button></div>
          ${overviewHtml}
          ${genresHtml}
          ${directorHtml}
          ${castHtml}
          <div class="overlay-section">
            <div class="overlay-label">Reviews</div>
            <div class="overlay-scores" id="ratingsScores">
              <span class="overlay-scores-loading">Loading…</span>
            </div>
          </div>
          <div class="overlay-section">
            <!-- Label is rewritten by paintProviders() to "Available to rent or buy" when
                 the film isn't streamable anywhere. The overlay template is re-rendered on
                 every open, so it resets to "Streaming" with no explicit cleanup. -->
            <div class="overlay-label" id="streamingLabel">Streaming</div>
            <div class="overlay-streaming" id="streamingProviders">
              <span class="overlay-streaming-loading">Loading…</span>
            </div>
            <div class="overlay-streaming-attribution">Streaming data powered by <a href="https://watchmode.com" target="_blank" rel="noopener">Watchmode.com</a></div>
          </div>
        </div>
      `;

      // Reset scroll to top whenever a new movie is rendered — the .overlay-scroll
      // container persists its scrollTop across renders since we only swap a child's
      // innerHTML, so without this a modal reopened (or carousel-navigated) onto
      // another long-metadata movie stays pinned to the previous scroll position.
      overlayContent.parentElement.scrollTop = 0;

      // Wire title, director, and cast pivot links. Scoped to [data-query] so the
      // share button (a .more-link with no data-query) isn't caught here.
      overlayContent.querySelectorAll(".more-link[data-query]").forEach(btn => {
        btn.addEventListener("click", () => triggerSearch(btn.dataset.query));
      });

      // Wire the share button separately — it opens the native share sheet (mobile) or
      // copies the link (desktop) rather than triggering a search.
      const shareBtn = overlayContent.querySelector(".overlay-title-share");
      if (shareBtn) shareBtn.addEventListener("click", () => shareMovie(result, shareBtn));

      // Update dots
      overlayDots.innerHTML = allResults.map((_, i) =>
        `<button class="overlay-dot${i === overlayIndex ? " active" : ""}" data-i="${i}" aria-label="Result ${i + 1}"></button>`
      ).join("");
      overlayDots.querySelectorAll(".overlay-dot").forEach(dot => {
        dot.addEventListener("click", () => navigateOverlay(+dot.dataset.i));
      });

      // Update arrows (desktop)
      overlayPrev.hidden = overlayIndex === 0;
      overlayNext.hidden = overlayIndex === allResults.length - 1;

      // Render streaming providers (from inline mock data, else async fetch).
      renderStreamingProviders(result);

      // Render critic/audience scores (from inline mock data, else async fetch).
      renderScores(result);
    }

    // Raw network fetch — returns parsed JSON. Callers store the returned Promise
    // in streamingCache so the same request is never duplicated.
    async function fetchStreamingData(title, year) {
      const params = new URLSearchParams({ title, country: userCountry });
      if (year) params.set("year", year);
      const res = await fetch(`/streaming?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // Fired once after the SSE stream completes. Sends a single batch request for all
    // result titles and populates streamingCache so overlay opens are instant.
    async function batchPrefetchStreamingProviders(results) {
      if (!results.length) return;
      try {
        const titles = results.map(r => ({ title: r.title, year: r.year || "" }));
        const res = await fetch("/streaming/batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ titles, country: userCountry }),
        });
        if (!res.ok) return;
        const data = await res.json();
        for (const item of data.results) {
          const key = `${item.title}|${item.year || ""}|${userCountry}`;
          // Don't overwrite an in-flight or already-resolved entry (e.g., user opened
          // an overlay before the batch completed and a direct fetch is underway).
          if (!streamingCache.has(key)) {
            streamingCache.set(key, Promise.resolve({
              providers: item.providers,
            }));
          }
        }
      } catch {
        // Silently fail — renderStreamingProviders falls back to a direct per-movie fetch
      }
    }

    // Watchmode returns a bare number with no currency code, so we infer one from the
    // region we asked about. An approximation: we assume the price is quoted in the
    // requested region's own currency, which is true for the regions Watchmode serves.
    const CURRENCY_BY_COUNTRY = {
      US: "USD", GB: "GBP", CA: "CAD", AU: "AUD", NZ: "NZD",
      DE: "EUR", FR: "EUR", ES: "EUR", IT: "EUR", IE: "EUR", NL: "EUR",
      IN: "INR", BR: "BRL", MX: "MXN", JP: "JPY",
    };

    function formatPrice(price) {
      if (typeof price !== "number" || !isFinite(price)) return "";
      const currency = CURRENCY_BY_COUNTRY[userCountry] || "USD";
      try {
        return new Intl.NumberFormat(undefined, { style: "currency", currency }).format(price);
      } catch {
        return `$${price.toFixed(2)}`; // unknown currency code — degrade rather than throw
      }
    }

    // One provider chip. Renders as a deep link to the title on that provider when we have
    // a url, else as a plain div — a chip should never claim to be clickable and then not go
    // anywhere meaningful. Opens in a new tab so the user keeps their results; on mobile the
    // major services' URLs are universal links, so this opens their app at the film.
    function providerChip(p) {
      const logoHtml = p.logo
        ? `<img src="${escapeHtml(p.logo)}" alt="${escapeHtml(p.name)}" onerror="this.style.display='none'" />`
        : "";
      const priceText = formatPrice(p.price);
      const priceHtml = priceText
        ? `<span class="overlay-provider-price">${escapeHtml(priceText)}</span>`
        : "";
      const inner = `${logoHtml}${escapeHtml(p.name)}${priceHtml}`;
      if (!p.url) return `<div class="overlay-provider">${inner}</div>`;
      // The chips themselves don't spell out rent vs buy — the price implies it and the
      // heading covers the section — so the hover title carries the distinction.
      const verb = p.type === "rent" ? "Rent" : p.type === "buy" ? "Buy" : "Watch";
      return `<a class="overlay-provider" href="${escapeHtml(p.url)}" target="_blank" `
        + `rel="noopener noreferrer" title="${verb} on ${escapeHtml(p.name)}">${inner}</a>`;
    }

    // Paint a provider list into the Streaming container. Subscription/free providers render
    // as chips under the "Streaming" heading; when there are none, the rent/buy options are
    // promoted to chips (with price) and the section *heading* changes to say so; an empty
    // list reports unavailability in the detected region.
    function paintProviders(container, providers) {
      const label = document.getElementById("streamingLabel");
      // Every branch sets the heading explicitly rather than relying on the overlay
      // template's default, so a re-render into an already-open overlay can't leave a
      // previous film's "Available to rent" label stranded above streamable chips.
      const setLabel = (text) => { if (label) label.textContent = text; };

      if (!providers || providers.length === 0) {
        setLabel("Streaming");
        const regionName = new Intl.DisplayNames(["en"], { type: "region" }).of(userCountry) || userCountry;
        container.innerHTML = `<span class="overlay-streaming-none">Not available for streaming in ${escapeHtml(regionName)}</span>`;
        return;
      }
      const streamable = providers.filter(p => p.type === "sub" || p.type === "free");
      const rentable = providers.filter(p => p.type === "rent" || p.type === "buy");
      if (streamable.length > 0) {
        setLabel("Streaming");
        container.innerHTML = streamable.map(providerChip).join("");
      } else {
        // Nothing streamable — the heading carries the caveat so the chips need no preamble.
        const hasRent = rentable.some(p => p.type === "rent");
        const hasBuy = rentable.some(p => p.type === "buy");
        setLabel(
          hasRent && hasBuy ? "Available to rent or buy"
            : hasBuy ? "Available to buy"
              : "Available to rent"
        );
        container.innerHTML = rentable.map(providerChip).join("");
      }
    }

    // Renders the Streaming section for a movie. Mock results carry an inline
    // `providers` array (so __mock__ makes no network call); live results fetch by
    // title/year, sharing the streamingCache Promise with any in-flight prefetch.
    async function renderStreamingProviders(result) {
      const container = document.getElementById("streamingProviders");
      if (!container) return;

      if (Array.isArray(result.providers)) {  // mock path — no network
        paintProviders(container, result.providers);
        return;
      }

      const title = result.title, year = result.year || "";
      const key = `${title}|${year}|${userCountry}`;
      // Re-use an existing Promise (resolved or in-flight) or start a new fetch.
      if (!streamingCache.has(key)) {
        streamingCache.set(key, fetchStreamingData(title, year));
      }

      try {
        const data = await streamingCache.get(key);
        if (!container.isConnected) return; // user navigated away
        paintProviders(container, data.providers);
      } catch {
        // Clear the failed entry so a later open can retry.
        streamingCache.delete(key);
        if (container.isConnected) {
          container.innerHTML = `<span class="overlay-streaming-none">Streaming info unavailable.</span>`;
        }
      }
    }

    // ── Reviews (critic/audience scores) ─────────────────────────────
    // Per-provider display metadata: hover label, sprite symbol, and glyph width.
    // Height is a uniform 20px (CSS); wordmarks (IMDb/TMDB) are wider than the
    // square icons (RT/Metacritic), so each sets its own width to keep aspect ratio.
    const SCORE_PROVIDERS = {
      rt: { label: "Rotten Tomatoes", symbol: "icon-rt", width: 20 },
      imdb: { label: "IMDb", symbol: "icon-imdb", width: 40 },
      metacritic: { label: "Metacritic", symbol: "icon-mc", width: 20 },
      tmdb: { label: "TMDB", symbol: "icon-tmdb", width: 40 },
    };

    // Paint an ordered [{provider, score, url}] list into the Reviews container as
    // clickable brand-glyph chips. Empty list → muted "no scores" note.
    function paintScores(container, scores) {
      if (!scores || !scores.length) {
        container.innerHTML = `<span class="overlay-scores-none">No review scores available.</span>`;
        return;
      }
      container.innerHTML = scores.map(s => {
        const meta = SCORE_PROVIDERS[s.provider];
        if (!meta) return "";  // unknown provider — skip rather than render a broken chip
        return `<a class="overlay-score" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(meta.label)}">`
          + `<svg class="overlay-score-icon" width="${meta.width}" height="20" aria-hidden="true"><use href="#${meta.symbol}"/></svg>`
          + `<span class="overlay-score-value">${escapeHtml(s.score)}</span></a>`;
      }).join("");
    }

    // Raw network fetch for one movie's scores — returns parsed JSON. Callers store
    // the returned Promise in scoresCache so a prefetch and a direct open share it.
    async function fetchScoresData(title, year) {
      const params = new URLSearchParams({ title });
      if (year) params.set("year", year);
      const res = await fetch(`/ratings?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // Fired once after the SSE stream completes (same trigger as the streaming
    // prefetch): one batch request warms scoresCache so overlay opens are instant.
    async function batchPrefetchScores(results) {
      if (!results.length) return;
      try {
        const titles = results.map(r => ({ title: r.title, year: r.year || "" }));
        const res = await fetch("/ratings/batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ titles }),
        });
        if (!res.ok) return;
        const data = await res.json();
        for (const item of data.results) {
          const key = `${item.title}|${item.year || ""}`;
          if (!scoresCache.has(key)) {
            scoresCache.set(key, Promise.resolve({ scores: item.scores }));
          }
        }
      } catch {
        // Silently fail — renderScores falls back to a direct per-movie fetch.
      }
    }

    // Renders the Reviews section for a movie. Mock results carry an inline `scores`
    // array (so __mock__ renders fully without a backend); live results fetch by
    // title/year, sharing the scoresCache Promise with any in-flight prefetch.
    function renderScores(result) {
      const container = document.getElementById("ratingsScores");
      if (!container) return;

      if (Array.isArray(result.scores)) {  // mock path — no network
        paintScores(container, result.scores);
        return;
      }

      const title = result.title, year = result.year || "";
      const key = `${title}|${year}`;
      if (!scoresCache.has(key)) {
        scoresCache.set(key, fetchScoresData(title, year));
      }
      scoresCache.get(key).then(data => {
        if (!container.isConnected) return;  // user navigated away
        paintScores(container, data.scores || []);
      }).catch(() => {
        scoresCache.delete(key);  // clear failed entry so a later open can retry
        if (container.isConnected) {
          container.innerHTML = `<span class="overlay-scores-none">Review scores unavailable.</span>`;
        }
      });
    }

    // ── Overlay event handlers ───────────────────────────────────────

    overlayClose.addEventListener("click", closeOverlay);

    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeOverlay();
    });

    overlayPrev.addEventListener("click", () => navigateOverlay(overlayIndex - 1));
    overlayNext.addEventListener("click", () => navigateOverlay(overlayIndex + 1));

    document.addEventListener("keydown", (e) => {
      if (!backdrop.classList.contains("open")) return;
      if (e.key === "Escape") closeOverlay();
      if (e.key === "ArrowLeft" && overlayIndex > 0) navigateOverlay(overlayIndex - 1);
      if (e.key === "ArrowRight" && overlayIndex < allResults.length - 1) navigateOverlay(overlayIndex + 1);
    });

    // Touch swipe for carousel
    let touchStartX = 0;
    const overlayPanel = document.getElementById("overlayPanel");

    overlayPanel.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    overlayPanel.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) < 50) return;
      if (dx < 0 && overlayIndex < allResults.length - 1) navigateOverlay(overlayIndex + 1);
      if (dx > 0 && overlayIndex > 0) navigateOverlay(overlayIndex - 1);
    }, { passive: true });

    // ── Back/forward navigation (History API) ────────────────────────

    window.addEventListener("popstate", (e) => {
      const state = e.state;

      if (!state || state.type === "empty") {
        closeOverlayUI();
        clearResults();
        input.value = "";
        toggleClearBtn();
        setStatus("");
        window.scrollTo(0, 0);
        return;
      }

      if (state.type === "overlay") {
        // Restore results if we've navigated away to a different search
        if (state.query !== input.value || allResults.length === 0) {
          restoreResults(state.results, state.query);
        }
        overlayIndex = state.overlayIndex;
        renderOverlay();
        backdrop.classList.add("open");
        document.body.style.overflow = "hidden";
        return;
      }

      if (state.type === "search") {
        closeOverlayUI();
        if (state.query !== input.value || allResults.length === 0) {
          restoreResults(state.results, state.query);
        }
        window.scrollTo(0, state.scrollY || 0);
      }
    });

    // ── Utilities ───────────────────────────────────────────────────

    function setLoading(loading) {
      btn.disabled = loading;
      spinner.style.display = loading ? "block" : "none";
    }

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "error" : "";
    }

    function clearResults() {
      resultsEl.innerHTML = "";
      allResults = [];
    }

    function restoreResults(results, query) {
      clearResults();
      input.value = query || "";
      toggleClearBtn();
      results.forEach((r, i) => appendResult(r, i));
      if (results.length) {
        setStatus(`${results.length} match${results.length !== 1 ? "es" : ""} for "${query}"`);
      } else {
        setStatus("");
      }
    }

    const CERTIFICATION_LABELS = {
      "G": "Rated G: General Audiences",
      "PG": "Rated PG: Parental Guidance Suggested",
      "PG-13": "Rated PG-13: Parents Strongly Cautioned",
      "R": "Rated R: Restricted",
      "NC-17": "Rated NC-17: Adults Only",
      "NR": "Not Rated",
    };

    function certificationTitle(certification) {
      return CERTIFICATION_LABELS[certification] || "Not Rated";
    }

    // Swap a poster <img> that 404s at the origin for the film-reel glyph, keeping the
    // poster frame so the layout stays consistent instead of collapsing. Handles both the
    // result card and the detail overlay (each has its own placeholder class).
    function posterFallback(img) {
      const frame = img.closest(".card-poster, .overlay-poster");
      if (!frame) return;
      const cls = frame.classList.contains("overlay-poster")
        ? "overlay-poster-placeholder"
        : "card-poster-placeholder";
      frame.innerHTML = `<div class="${cls}">&#127909;</div>`;
    }

    function updateCardCertification(idx, certification) {
      const el = document.getElementById(`card-certification-${idx}`);
      if (el && certification) {
        el.textContent = certification;
        el.title = certificationTitle(certification);
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ── History init ─────────────────────────────────────────────────
    // Let popstate manage scroll; disable the browser's automatic restoration.
    history.scrollRestoration = "manual";
    // Stamp the initial entry so back from the first search lands on a clean blank page.
    history.replaceState({ type: "empty" }, "", location.href);
    // Auto-run a search for ?q= deep links and page refreshes. A ?detail= (Title (Year))
    // marks a shared link: stash it so the search's "done" handler auto-opens that card.
    (function () {
      const params = new URLSearchParams(location.search);
      const q = params.get("q");
      if (q) {
        input.value = q;
        toggleClearBtn();
        pendingDetailOpen = params.get("detail");
        form.requestSubmit();
      }
    })();
  </script>

</body>

</html>
