<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieMatch</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 36px;
    }

    header h4 {
      margin-top: 8px;
      font-size: 1.8rem;
      color: #888;
    }

    header p {
      margin-top: 8px;
      font-size: 1rem;
      font-style: italic;
      color: #888;
    }

    .search-form {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 48px;
    }

    .search-form input {
      flex: 1;
      padding: 14px 18px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #e8e8e8;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-form input::placeholder {
      color: #555;
    }

    .search-form input:focus {
      border-color: #555;
    }

    .search-form button {
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: #e8e8e8;
      color: #0f0f0f;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    .search-form button:hover {
      background: #fff;
    }

    .search-form button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 32px;
      min-height: 1.2em;
    }

    #status.error {
      color: #e05c5c;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease both;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .card:hover {
      border-color: #444;
      background: #1f1f1f;
    }

    .card-poster {
      width: 60px;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
      background: #2a2a2a;
      aspect-ratio: 2/3;
    }

    .card-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-rank {
      font-size: 0.85rem;
      font-weight: 700;
      color: #444;
      min-width: 24px;
      padding-top: 2px;
    }

    .card-body {
      flex: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }

    .card-title-link {
      color: inherit;
      text-decoration: none;
    }

    .card-title-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .card-year {
      font-weight: 400;
      color: #fff;
      margin-left: 6px;
      font-size: 0.95rem;
    }

    .card-explanation {
      font-size: 0.9rem;
      color: #888;
      line-height: 1.5;
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid #333;
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Overlay ─────────────────────────────────────────────────── */

    .overlay-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .overlay-backdrop.open {
      display: flex;
    }

    .overlay-panel {
      position: relative;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      width: min(640px, calc(100vw - 32px));
      height: min(520px, calc(100vh - 64px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: overlayIn 0.2s ease both;
    }

    .overlay-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 32px 32px 24px;
    }

    @keyframes overlayIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .overlay-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #555;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    .overlay-close:hover {
      color: #e8e8e8;
      background: #2a2a2a;
    }

    .overlay-content {
      display: flex;
      gap: 24px;
    }

    .overlay-poster {
      flex-shrink: 0;
      width: 120px;
      border-radius: 10px;
      overflow: hidden;
      background: #2a2a2a;
      aspect-ratio: 2/3;
      align-self: flex-start;
    }

    .overlay-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay-poster-placeholder {
      width: 100%;
      height: 100%;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 2rem;
    }

    .overlay-info {
      flex: 1;
      min-width: 0;
    }

    .overlay-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .overlay-title-year {
      font-weight: 400;
      color: #fff;
      font-size: 1.1rem;
      margin-left: 8px;
    }

    .overlay-section {
      margin-bottom: 14px;
    }

    .overlay-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin-bottom: 4px;
    }

    .overlay-text {
      font-size: 0.9rem;
      color: #b0b0b0;
      line-height: 1.55;
    }

    .overlay-streaming {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .overlay-provider {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #242424;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.82rem;
      color: #ccc;
    }

    .overlay-provider img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
    }

    .overlay-streaming-loading {
      font-size: 0.85rem;
      color: #555;
      font-style: italic;
    }

    .overlay-streaming-none {
      font-size: 0.85rem;
      color: #555;
    }

    /* ── Carousel nav ────────────────────────────────────────────── */

    .overlay-frame {
      position: relative;
      display: flex;
      align-items: center;
      width: min(640px, calc(100vw - 32px));
    }

    .overlay-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 14px 32px 18px;
      border-top: 1px solid #2a2a2a;
    }

    .overlay-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .overlay-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: none;
      background: #3a3a3a;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s, transform 0.15s;
    }

    .overlay-dot.active {
      background: #ccc;
      transform: scale(1.25);
    }

    .overlay-dot:hover:not(.active) {
      background: #666;
    }

    .overlay-arrow {
      display: none;
    }

    @media (min-width: 521px) {
      .overlay-arrow {
        display: flex;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 50%;
        color: #aaa;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, opacity 0.15s;
        padding: 0;
      }

      .overlay-arrow:hover {
        background: #2e2e2e;
        color: #fff;
      }

      .overlay-arrow[hidden] {
        visibility: hidden;
        pointer-events: none;
      }

      .overlay-arrow-prev {
        right: calc(100% + 12px);
      }

      .overlay-arrow-next {
        left: calc(100% + 12px);
      }
    }

    /* ── Mobile ──────────────────────────────────────────────────── */

    @keyframes overlaySlideUp {
      from {
        transform: translateY(100%);
        opacity: 1;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 32px 16px;
      }

      header h1 {
        font-size: 2rem;
        margin-bottom: 16px;
      }

      header h4 {
        font-size: 1.2rem;
      }

      .search-form {
        margin-bottom: 32px;
      }

      .card {
        padding: 14px 16px;
        gap: 12px;
      }

      .overlay-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 88vh;
        border-radius: 20px 20px 0 0;
        animation: overlaySlideUp 0.25s ease both;
      }

      .overlay-scroll {
        padding: 20px 16px 16px;
      }

      .overlay-nav {
        padding: 10px 16px 20px;
      }

      .overlay-close {
        top: 12px;
        right: 12px;
      }

      .overlay-poster {
        width: 80px;
      }

      .overlay-title {
        font-size: 1.1rem;
      }

      .overlay-nav-btn {
        padding: 8px 12px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>MovieMatch</h1>
    <h4>What would you like to watch today?</h4>
    <p>Describe what you're in the mood for and we'll find the best matches.</p>
  </header>

  <form class="search-form" id="searchForm">
    <input type="text" id="queryInput" placeholder="e.g., a gangster movie that is also a little bit funny"
      autocomplete="off" autofocus />
    <button type="submit" id="submitBtn">Search</button>
  </form>

  <div id="status"></div>
  <div class="spinner" id="spinner"></div>
  <div class="results" id="results"></div>

  <!-- Detail overlay -->
  <div class="overlay-backdrop" id="overlayBackdrop" role="dialog" aria-modal="true">
    <div class="overlay-frame">
      <button class="overlay-arrow overlay-arrow-prev" id="overlayPrev" aria-label="Previous">&#8249;</button>
      <div class="overlay-panel" id="overlayPanel">
        <button class="overlay-close" id="overlayClose" aria-label="Close">&times;</button>
        <div class="overlay-scroll">
          <div class="overlay-content" id="overlayContent"></div>
        </div>
        <div class="overlay-nav">
          <div class="overlay-dots" id="overlayDots"></div>
        </div>
      </div>
      <button class="overlay-arrow overlay-arrow-next" id="overlayNext" aria-label="Next">&#8250;</button>
    </div>
  </div>

  <script>
    const API_URL = "/recommend";

    const form = document.getElementById("searchForm");
    const input = document.getElementById("queryInput");
    const btn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const spinner = document.getElementById("spinner");
    const resultsEl = document.getElementById("results");
    const backdrop = document.getElementById("overlayBackdrop");
    const overlayContent = document.getElementById("overlayContent");
    const overlayClose = document.getElementById("overlayClose");
    const overlayPrev = document.getElementById("overlayPrev");
    const overlayNext = document.getElementById("overlayNext");
    const overlayDots = document.getElementById("overlayDots");

    let allResults = [];
    let overlayIndex = 0;

    // ── Search ──────────────────────────────────────────────────────

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      setLoading(true);
      clearResults();
      setStatus("");

      let resultCount = 0;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server error (${res.status})`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            let event;
            try { event = JSON.parse(line.slice(6)); } catch { continue; }

            if (event.type === "result") {
              if (resultCount === 0) setLoading(false);
              appendResult(event, resultCount);
              resultCount++;
            } else if (event.type === "done") {
              if (resultCount === 0) {
                setStatus(event.message || "No relevant matches found. Try a different query.");
              } else {
                setStatus(`${resultCount} match${resultCount !== 1 ? "es" : ""} for "${query}"`);
              }
            } else if (event.type === "error") {
              throw new Error(event.message);
            }
          }
        }

      } catch (err) {
        setStatus(err.message, true);
      } finally {
        setLoading(false);
      }
    });

    // ── Card rendering ──────────────────────────────────────────────

    function appendResult(result, i) {
      allResults.push(result);
      const idx = i;

      const card = document.createElement("div");
      card.className = "card";
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");

      const posterHtml = result.movie_poster
        ? `<div class="card-poster"><img src="https://image.tmdb.org/t/p/w185${escapeHtml(result.movie_poster)}" alt="${escapeHtml(result.title)}" loading="lazy" /></div>`
        : "";

      const yearHtml = result.year
        ? `<span class="card-year">(${escapeHtml(result.year)})</span>`
        : "";

      card.innerHTML = `
        <div class="card-rank">${idx + 1}</div>
        ${posterHtml}
        <div class="card-body">
          <div class="card-title">
            <a class="card-title-link" href="#" tabindex="-1">${escapeHtml(result.title)}</a>${yearHtml}
          </div>
          <div class="card-explanation">${escapeHtml(result.explanation)}</div>
        </div>
      `;

      card.addEventListener("click", (e) => {
        e.preventDefault();
        openOverlay(idx);
      });

      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openOverlay(idx);
        }
      });

      resultsEl.appendChild(card);
    }

    // ── Overlay ─────────────────────────────────────────────────────

    function openOverlay(index) {
      overlayIndex = index;
      renderOverlay();
      backdrop.classList.add("open");
      document.body.style.overflow = "hidden";
      overlayClose.focus();
    }

    function closeOverlay() {
      backdrop.classList.remove("open");
      document.body.style.overflow = "";
    }

    function renderOverlay() {
      const result = allResults[overlayIndex];
      if (!result) return;

      const posterHtml = result.movie_poster
        ? `<img src="https://image.tmdb.org/t/p/w300${escapeHtml(result.movie_poster)}" alt="${escapeHtml(result.title)}" />`
        : `<div class="overlay-poster-placeholder">&#127909;</div>`;

      const yearDisplay = result.year ? `<span class="overlay-title-year">(${escapeHtml(result.year)})</span>` : "";

      const directorHtml = result.director
        ? `<div class="overlay-section">
            <div class="overlay-label">Director</div>
            <div class="overlay-text">${escapeHtml(result.director)}</div>
           </div>`
        : "";

      const castHtml = result.cast && result.cast.length
        ? `<div class="overlay-section">
            <div class="overlay-label">Cast</div>
            <div class="overlay-text">${result.cast.map(escapeHtml).join(", ")}</div>
           </div>`
        : "";

      const overviewHtml = result.overview
        ? `<div class="overlay-section">
            <div class="overlay-label">Overview</div>
            <div class="overlay-text">${escapeHtml(result.overview)}</div>
           </div>`
        : "";

      overlayContent.innerHTML = `
        <div class="overlay-poster">${posterHtml}</div>
        <div class="overlay-info">
          <div class="overlay-title">${escapeHtml(result.title)}${yearDisplay}</div>
          ${overviewHtml}
          ${directorHtml}
          ${castHtml}
          <div class="overlay-section">
            <div class="overlay-label">Streaming</div>
            <div class="overlay-streaming" id="streamingProviders">
              <span class="overlay-streaming-loading">Loading…</span>
            </div>
          </div>
        </div>
      `;

      // Update dots
      overlayDots.innerHTML = allResults.map((_, i) =>
        `<button class="overlay-dot${i === overlayIndex ? " active" : ""}" data-i="${i}" aria-label="Result ${i + 1}"></button>`
      ).join("");
      overlayDots.querySelectorAll(".overlay-dot").forEach(dot => {
        dot.addEventListener("click", () => { overlayIndex = +dot.dataset.i; renderOverlay(); });
      });

      // Update arrows (desktop)
      overlayPrev.hidden = overlayIndex === 0;
      overlayNext.hidden = overlayIndex === allResults.length - 1;

      // Fetch streaming providers asynchronously
      fetchStreamingProviders(result.title, result.year || "");
    }

    async function fetchStreamingProviders(title, year) {
      const container = document.getElementById("streamingProviders");
      if (!container) return;
      try {
        const params = new URLSearchParams({ title });
        if (year) params.set("year", year);
        const res = await fetch(`/streaming?${params}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (!container.isConnected) return; // user navigated away

        if (!data.providers || data.providers.length === 0) {
          container.innerHTML = `<span class="overlay-streaming-none">Not available for streaming in the US</span>`;
          return;
        }
        container.innerHTML = data.providers.map(p => {
          const logoHtml = p.logo
            ? `<img src="https://image.tmdb.org/t/p/w45${escapeHtml(p.logo)}" alt="${escapeHtml(p.name)}" />`
            : "";
          return `<div class="overlay-provider">${logoHtml}${escapeHtml(p.name)}</div>`;
        }).join("");
      } catch {
        if (container.isConnected) {
          container.innerHTML = `<span class="overlay-streaming-none">Streaming info unavailable</span>`;
        }
      }
    }

    // ── Overlay event handlers ───────────────────────────────────────

    overlayClose.addEventListener("click", closeOverlay);

    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeOverlay();
    });

    overlayPrev.addEventListener("click", () => { overlayIndex--; renderOverlay(); });
    overlayNext.addEventListener("click", () => { overlayIndex++; renderOverlay(); });

    document.addEventListener("keydown", (e) => {
      if (!backdrop.classList.contains("open")) return;
      if (e.key === "Escape") closeOverlay();
      if (e.key === "ArrowLeft" && overlayIndex > 0) { overlayIndex--; renderOverlay(); }
      if (e.key === "ArrowRight" && overlayIndex < allResults.length - 1) { overlayIndex++; renderOverlay(); }
    });

    // Touch swipe for carousel
    let touchStartX = 0;
    const overlayPanel = document.getElementById("overlayPanel");

    overlayPanel.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    overlayPanel.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) < 50) return;
      if (dx < 0 && overlayIndex < allResults.length - 1) { overlayIndex++; renderOverlay(); }
      if (dx > 0 && overlayIndex > 0) { overlayIndex--; renderOverlay(); }
    }, { passive: true });

    // ── Utilities ───────────────────────────────────────────────────

    function setLoading(loading) {
      btn.disabled = loading;
      spinner.style.display = loading ? "block" : "none";
    }

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "error" : "";
    }

    function clearResults() {
      resultsEl.innerHTML = "";
      allResults = [];
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>

</body>

</html>
